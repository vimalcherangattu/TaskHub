<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ambalam</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2230%22 fill=%22%233B5B8C%22/><text x=%2250%22 y=%2270%22 text-anchor=%22middle%22 font-family=%22system-ui,sans-serif%22 font-weight=%22800%22 font-size=%2262%22 fill=%22%23FFFFFF%22>a</text></svg>">
<meta name="theme-color" content="#FFFFFF">
<script>try{if(localStorage.getItem("hub-theme")==="dark")document.documentElement.dataset.theme="dark"}catch{}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ambalam">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://mbbucsageoyxhekzbmyq.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --raised:#FFFFFF; --sunken:#F2F4F7; --side:#F6F7F9; --ink:#1C2430; --muted:#4B5565; --faint:#5D6675;
  --line:#E4E7EC; --line-strong:#CDD3DC; --control:#8A93A1;
  --accent:#3B5B8C; --accent-soft:#EAF0F8; --strong:#3B5B8C; --on-strong:#FFFFFF; --danger:#A63D33; --danger-soft:#FBEAE7;
  --warn:#875400; --ok:#26683F; --ok-soft:#DDEFE3;
  --f-blue:#3D6FA8; --f-white:#B4BCC8; --f-red:#C0564A; --f-green:#4A8A63; --f-yellow:#D6A23A;
  --radius-s:10px; --radius-m:16px; --radius-l:20px; --radius-xl:28px;
  --lift:0 2px 4px rgba(28,36,48,.06),0 24px 48px -16px rgba(28,36,48,.2);
  --soft:0 1px 0 var(--line);
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --serif:"IBM Plex Serif",Georgia,serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121418; --side:#121418; --surface:#181B20; --raised:#1E2228; --sunken:#0C0E11; --ink:#E8EBF0; --muted:#B3BAC5; --faint:#9199A5;
  --line:#262B33; --line-strong:#363D47; --control:#727B88;
  --accent:#8FB0E0; --accent-soft:#1A2436; --strong:#7E9FD1; --on-strong:#0E1420; --danger:#FF8A80; --danger-soft:#2E1715;
  --warn:#F2B65A; --ok:#6FD39A; --ok-soft:#12291D; --f-white:#C3CAD4;
  --lift:0 2px 4px rgba(0,0,0,.5),0 24px 48px -16px rgba(0,0,0,.8); color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:var(--accent-soft)}

/* layout */
.app{display:grid;grid-template-columns:272px 1fr;height:100%}
.app:has(aside:empty){grid-template-columns:1fr}
aside:empty{display:none}
aside{padding:28px 18px;overflow-y:auto;background:var(--side)}
main{overflow-y:auto;padding:40px clamp(16px,4vw,56px) 120px;scroll-behavior:smooth}
.wrap{max-width:900px;margin:0 auto;animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* sidebar */
.brand{display:grid;grid-template-columns:30px 1fr;column-gap:12px;align-items:center;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;padding:0 10px 26px}
.brand::before{content:"a";grid-row:span 2;width:30px;height:30px;border-radius:9px;background:var(--strong);color:var(--on-strong);display:grid;place-items:center;font-weight:800;font-size:16px;line-height:1}
.brand small{display:block;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;min-height:40px;padding:0 12px;border-radius:12px;text-align:left;font-weight:500;color:var(--muted);transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease)}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--soft),0 0 0 1px var(--line)}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;opacity:.85}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav .count.hot{color:var(--danger);font-weight:500}
.nav .count.new{color:var(--accent);font-weight:500}
.group-h{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:16px 12px 6px}
.dot{width:10px;height:10px;border-radius:4px;flex:none}
.nav button.ws{font-weight:600;color:var(--ink)}
.nav button.sub{min-height:36px;padding:0 12px 0 34px;font-size:14px;color:var(--muted)}
.nav button.sub[aria-current="true"]{color:var(--ink)}
.crumb{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
.crumb:hover{text-decoration:underline;text-underline-offset:3px}
.side-add{border:1px dashed var(--line-strong);background:none;border-radius:12px;min-height:40px;padding:0 12px;width:100%;text-align:left;color:var(--faint);margin-top:10px;transition:background .18s var(--ease),color .18s}
.side-add:hover{background:var(--sunken);color:var(--ink)}

/* page heads */
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head h1{font-family:var(--display);font-size:clamp(30px,4.2vw,42px);line-height:1.08;letter-spacing:-.03em;margin:0;font-weight:700}
.head .sub{color:var(--muted);font-size:15px;margin-top:8px;max-width:56ch}
.head .right{margin-left:auto;text-align:right}
.meter{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;font-size:26px;letter-spacing:-.02em}
.meter span{font-family:var(--sans);font-weight:400;font-size:14px;letter-spacing:0;color:var(--muted)}
.bar{height:6px;background:var(--sunken);border-radius:999px;overflow:hidden;width:200px;margin-top:8px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width 1.2s var(--ease)}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:6px 0 30px}
.day{border:0;background:transparent;border-radius:16px;padding:12px 4px 10px;text-align:center;position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);transition:background .18s var(--ease),color .18s var(--ease),transform .09s}
.day:hover{background:var(--sunken)}
.day:active{transform:scale(.97)}
.day .dn{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.day .dd{font-size:19px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.day .load{display:block;height:4px;max-width:40px;border-radius:999px;background:var(--line-strong);margin-top:6px}
.day[aria-pressed="true"] .load{background:var(--bg)}
.day.is-today{box-shadow:inset 0 0 0 1.5px var(--line-strong);background:var(--surface)}
.day.is-past{opacity:.55}
.day[aria-pressed="true"]{background:var(--strong);color:var(--on-strong);box-shadow:none}
.day[aria-pressed="true"] .dd{color:var(--bg)}

/* quick add */
.quick{display:flex;gap:8px;margin-bottom:30px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:6px 6px 6px 16px;transition:border-color .18s,box-shadow .18s var(--ease)}
.quick:focus-within{border-color:var(--line-strong);box-shadow:var(--lift)}
.quick input{flex:1;border:0;background:none;padding:10px 4px;min-width:0}
.quick input:focus{outline:none}
.quick input::placeholder{color:var(--faint)}
.quick select{border:0;background:var(--sunken);border-radius:12px;padding:0 10px;max-width:38%;color:var(--muted)}
.quick button{border:0;background:var(--strong);color:var(--on-strong);border-radius:14px;padding:0 20px;min-height:44px;font-weight:500;transition:transform .09s,opacity .18s}
.quick button:active{transform:translateY(1px) scale(.98)}

/* mind map */
.brain{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.brain-canvas{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);overflow:hidden}
.brain-canvas svg{display:block;width:100%;height:max(460px,calc(100vh - 230px));touch-action:none}
.brain-tools{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.brain-tools>*{pointer-events:auto}
.brain-tools input{flex:1 1 180px;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:8px 12px;min-width:0}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);pointer-events:none}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.bpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:20px;max-height:calc(100vh - 150px);overflow-y:auto}
.bpanel h3{margin:2px 0 4px;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.bpanel .k{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.bpanel .about{color:var(--muted);margin:8px 0 14px;font-size:14px;white-space:pre-wrap}
.bpanel h4{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 4px;color:var(--faint)}
.bpanel .task{padding:8px 0}
.nitem{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;text-align:left}
.nitem b{font-weight:600;display:flex;align-items:center;gap:8px}
.nitem span.t{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kd{width:8px;height:8px;border-radius:50%;flex:none}
.pl{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;text-align:left;font-weight:500}
.pl .count{margin-left:auto;color:var(--faint);font-size:13px}
.bn text{font-family:var(--sans);pointer-events:none}
@media (max-width:1000px){.brain{grid-template-columns:1fr}.bpanel{max-height:none}}

/* filters & chips */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters input{flex:1 1 220px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;min-width:0}
.filters select,#sortSel,#tsort{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--muted);transition:background .18s var(--ease),color .18s,border-color .18s}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip span{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:2px}
.chip[aria-pressed="true"]{background:var(--strong);border-color:var(--strong);color:var(--on-strong)}
.gh{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;padding:16px 4px 4px}
.gh span{font-weight:400}

/* sections */
section{margin-bottom:32px}
.sh{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;padding:0 4px 8px}
.sh h2{font-family:var(--mono);font-size:12px;margin:0;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sh h2 .n,.sh h2 span{text-transform:none;letter-spacing:0}
.sh .n{color:var(--faint);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.sh .act{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:500;font-size:13px;padding:2px 0}
.sh .act:hover{text-decoration:underline;text-underline-offset:3px}
.sh.danger h2{color:var(--danger)}
.empty{color:var(--faint);padding:14px 16px;font-size:14px;border:1px dashed var(--line-strong);border-radius:var(--radius-m)}

/* task rows */
.task{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:var(--radius-m);position:relative;transition:background .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease)}
.task+.task{margin-top:2px}
.task:hover,.task:focus-within{background:var(--surface);box-shadow:var(--lift);transform:translateY(-1px);z-index:1}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--control);background:none;margin-top:0;display:grid;place-items:center;padding:0;transition:background .2s var(--spring),border-color .18s,transform .09s}
.chk:hover{border-color:var(--ok);background:var(--ok-soft)}
.chk:active{transform:scale(.88)}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.doing .chk{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 4px,transparent 4.5px)}
.task.doing .title{font-weight:600}
.task.doing{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.meta .resume{flex-basis:100%;color:var(--muted);font-family:var(--serif);font-style:italic;background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:6px}
.meta .carry{color:var(--warn);font-weight:500}
.meta .started{color:var(--accent);font-weight:500}
.chk svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.5);transition:opacity .18s,transform .25s var(--spring)}
.task.done .chk svg{opacity:1;transform:none}
:root[data-theme="dark"] .chk svg{stroke:var(--bg)}
.body{flex:1;min-width:0}
.title{border:0;background:none;padding:0;text-align:left;font-weight:500;display:block;width:100%;overflow-wrap:anywhere;line-height:1.5}
.task.done .title{text-decoration:line-through;text-decoration-color:var(--line-strong);color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--faint);margin-top:2px}
.meta .proj{display:inline-flex;align-items:center;gap:6px}
.meta .proj .dot{width:8px;height:8px;border-radius:50%}
.meta .late{color:var(--danger);font-weight:500}
.meta .soon{color:var(--warn);font-weight:500}
.meta .wait{color:var(--accent)}
.meta .stale{color:var(--warn)}
.tools{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end;opacity:0;transform:translateX(4px);transition:opacity .18s var(--ease),transform .18s var(--ease)}
.task:hover .tools,.task:focus-within .tools{opacity:1;transform:none}
.tool{border:1px solid var(--line);background:var(--raised);border-radius:999px;font-size:12px;font-weight:500;padding:4px 10px;color:var(--muted);transition:background .18s,border-color .18s,color .18s}
.tool:hover{border-color:var(--line-strong);color:var(--ink)}
.tool.yes{color:var(--ok);border-color:var(--ok)}
.tool[aria-pressed="true"]{background:var(--strong);border-color:var(--strong);color:var(--on-strong)}

/* steps & Claude updates */
.stepchip{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--muted);font-weight:500;font-size:13px}
.stepchip i{width:28px;height:4px;border-radius:999px;background:linear-gradient(90deg,var(--ok) var(--p),var(--sunken) var(--p))}
.stepchip:hover{color:var(--ink)}
.meta .alldone{color:var(--ok);font-weight:500}
.meta .upd{flex-basis:100%;color:var(--accent)}
.steps{display:flex;flex-direction:column;gap:2px;margin:8px 0 2px}
.step{display:flex;align-items:flex-start;gap:10px;border:0;background:none;padding:5px 6px;margin-left:-6px;border-radius:8px;text-align:left;font-size:14px;color:var(--ink);transition:background .18s}
.step:hover{background:var(--sunken)}
.step.on{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.sbox{flex:none;width:18px;height:18px;margin-top:2px;border-radius:6px;border:1.5px solid var(--control);display:grid;place-items:center;background:none;padding:0;transition:background .2s var(--spring),border-color .18s}
.sbox svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.on>.sbox,.step-ed.on .sbox{background:var(--ok);border-color:var(--ok)}
.on>.sbox svg,.step-ed.on .sbox svg{opacity:1}
:root[data-theme="dark"] .sbox svg{stroke:var(--bg)}
.steps-ed{display:flex;flex-direction:column;gap:6px}
.dlg .lbl{font-size:13px;font-weight:500;color:var(--muted)}
.step-ed{display:flex;align-items:center;gap:8px}
.step-ed .sbox{margin:0;width:22px;height:22px}
.dlg .step-ed input{flex:1;min-width:0;min-height:38px;padding:6px 10px}
.step-ed.on input{color:var(--faint);text-decoration:line-through}
.sdel{flex:none;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--faint);font-size:18px}
.sdel:hover{background:var(--sunken);color:var(--danger)}
.activity{display:flex;flex-direction:column;gap:6px}
.activity:empty{display:none}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:10px;font-size:13px;color:var(--muted);align-items:baseline}
.act b{font-weight:600;color:var(--ink)}
.act time{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}

/* dependencies */
.meta .dep{color:var(--warn)}
.meta .dep em{font-style:normal;color:var(--faint)}
.deplink{border:0;background:none;padding:0;color:inherit;font-weight:500;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.deplink:hover{text-decoration-color:currentColor}
.meta .unblocks{color:var(--accent);font-weight:500}
.task.blocked .chk{border-style:dotted}
.task.blocked .title{color:var(--muted)}
.deps-ed{display:flex;flex-direction:column;gap:6px}
.depchip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;color:var(--ink)}
.depchip.isdone{color:var(--faint);text-decoration:line-through}
.depchip button{border:0;background:none;width:24px;height:24px;border-radius:999px;color:var(--faint);font-size:15px;padding:0}
.depchip button:hover{background:var(--sunken);color:var(--danger)}
#depList:empty{display:none}

/* context layer */
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:18px 20px 12px;margin-bottom:24px}
.brief-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.brief-h .k,.call-notes .k{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.when{font-size:12px;color:var(--faint)}
.brief-status{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.35;margin:8px 0 6px}
.md{font-size:14px;color:var(--muted)}
.md p{margin:6px 0}.md ul{margin:4px 0 8px;padding-left:18px}.md li{margin:2px 0}.md b{color:var(--ink);font-weight:600}.md h4{margin:10px 0 2px;font-size:14px;color:var(--ink)}
.md.clamp{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.brief .act{border:0;background:none;color:var(--accent);font-weight:500;font-size:13px;padding:6px 0}
.call{border-radius:var(--radius-m);padding:12px 16px;transition:background .18s}

{const c=new Map(),f=Date.prototype.toLocaleDateString;Date.prototype.toLocaleDateString=function(l,o){if(isNaN(this))return f.call(this,l,o);const k=l+"|"+JSON.stringify(o||{});let d=c.get(k);if(!d){d=new Intl.DateTimeFormat(l,o);c.set(k,d)}return d.format(this)}}

/* ---------- task logic ---------- */

const doneOn=(t,d)=>t.status==="done"&&t.doneAt&&iso(new Date(t.doneAt))===d;

const doing=t=>t.status==="doing";
const waiting=t=>t.status==="waiting";

function showCode(email,msg){
  document.getElementById("view").innerHTML=`<form class="login" id="codeForm"><h1>Ambalam</h1><div class="sub" style="color:var(--muted)">${esc(msg||"Check your inbox. Tap the link, or right-click it, copy it and paste it here.")}</div><input name="code" required autocomplete="one-time-code" placeholder="Paste the link or code" aria-label="Sign-in link or code from the email"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" id="codeBack">Use a different email</button></form>`;
  document.getElementById("codeBack").onclick=()=>showLogin();
  document.getElementById("codeForm").addEventListener("submit",async e=>{e.preventDefault();
    const v=e.target.code.value.trim(),u=(()=>{try{return decodeURIComponent(v)}catch{return v}})(),h=u.match(/[?&]token=([\w-]+)/),ty=u.match(/[?&]type=(\w+)/);
    const{error}=await sb.auth.verifyOtp(h?{token_hash:h[1],type:ty?.[1]||"magiclink"}:{email,token:v.replace(/\s/g,""),type:"email"});
    if(error)showCode(email,"That didn't work. The link may have expired or been used, or a newer email replaced it.")});
}
let started=false;
async function start(){
  if(started)return;started=true;
  const hm=location.hash.match(/^#call\/([\w-]+)/);if(hm){S.view="calls";S.cs=hm[1]}
  if(loadCache())render();
  // shared from another app, a bookmarklet or a shortcut: ?title=&text=&url= or ?capture=
  const sp=new URLSearchParams(location.search),shared=["title","text","url","capture"].map(k=>sp.get(k)).filter(Boolean);
  const cap=shared.length?[...new Set(shared)].join("\n"):null;if(cap)try{history.replaceState(null,"",location.pathname+location.hash)}catch{}
  const first=refresh();if(cap){if(!S.ready.t)await first;openCapture(cap)}await first;
  (window.requestIdleCallback||setTimeout)(()=>needD3().catch(()=>{}));
  sb.channel("hub").on("postgres_changes",{event:"*",schema:"public",table:"tasks"},mergeTask).on("postgres_changes",{event:"*",schema:"public",table:"projects"},soon).on("postgres_changes",{event:"*",schema:"public",table:"notes"},soon)
    .on("postgres_changes",{event:"*",schema:"public",table:"project_briefs"},soon).on("postgres_changes",{event:"*",schema:"public",table:"source_segments"},soon)
    .on("postgres_changes",{event:"*",schema:"public",table:"sources"},soon).on("postgres_changes",{event:"INSERT",schema:"public",table:"changes"},later)
    .on("postgres_changes",{event:"*",schema:"public",table:"inputs"},soon).on("postgres_changes",{event:"*",schema:"public",table:"input_uses"},soon)
    .on("postgres_changes",{event:"*",schema:"public",table:"call_series"},()=>{S.prepDirty=true;soon()}).on("postgres_changes",{event:"*",schema:"public",table:"agenda_items"},()=>{S.prepDirty=true;soon()}).subscribe();
  let last=T();setInterval(()=>{if(T()!==last){last=T();render()}},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)soon()});
}
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session)start();else showLogin();
  sb.auth.onAuthStateChange((ev,s)=>{if(s&&!started)start()});
})();
</script>
