<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏔️</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Task Hub">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EA; --surface:#F8FAF6; --raised:#FFFFFF; --ink:#1C2826; --muted:#5F6B67; --faint:#8A948F;
  --line:#D5DBD2; --accent:#2B3F8F; --accent-soft:#E2E6F4; --danger:#B8392A; --danger-soft:#F6E1DD;
  --warn:#B07A0C; --ok:#2F7A4A;
  --f-blue:#2F6DB5; --f-white:#A7B1AC; --f-red:#C4412F; --f-green:#3E8A57; --f-yellow:#E0A21A;
  --radius-s:6px; --radius-m:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131A19; --surface:#1A2322; --raised:#212C2A; --ink:#E6ECE7; --muted:#9DA9A4; --faint:#6E7A75;
    --line:#2D3937; --accent:#95A7F2; --accent-soft:#252F52; --danger:#EE7F6D; --danger-soft:#3A2220;
    --warn:#E6B54A; --ok:#6BC28B; --f-white:#CBD3CF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A19; --surface:#1A2322; --raised:#212C2A; --ink:#E6ECE7; --muted:#9DA9A4; --faint:#6E7A75;
  --line:#2D3937; --accent:#95A7F2; --accent-soft:#252F52; --danger:#EE7F6D; --danger-soft:#3A2220;
  --warn:#E6B54A; --ok:#6BC28B; --f-white:#CBD3CF; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:260px 1fr;height:100%}
aside{border-right:1px solid var(--line);padding:22px 14px;overflow-y:auto;background:var(--surface)}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;padding:0 10px 18px}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:var(--radius-s);text-align:left;font-weight:500}
.nav button:hover{background:var(--bg)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .count.hot{color:var(--danger);font-weight:600}
.nav .count.new{color:var(--accent);font-weight:600}
.group-h{font-size:13px;font-weight:600;color:var(--faint);padding:14px 10px 4px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.side-add{border:1px dashed var(--line);background:none;border-radius:var(--radius-s);padding:7px 10px;width:100%;text-align:left;color:var(--muted);margin-top:10px}

main{overflow-y:auto;padding:28px clamp(16px,4vw,48px) 120px}
.wrap{max-width:860px;margin:0 auto}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:clamp(30px,4.4vw,44px);line-height:1.05;letter-spacing:-.025em;margin:0;font-weight:800}
.head .sub{color:var(--muted);font-size:15px;margin-top:6px}
.head .right{margin-left:auto;text-align:right}
.meter{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px}
.meter span{font-weight:500;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:180px;margin-top:6px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .4s}

/* the week strip: prayer-flag ribbon */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 26px}
.day{border:0;background:var(--raised);border-radius:0 0 var(--radius-s) var(--radius-s);padding:0 0 10px;text-align:left;position:relative;min-width:0;box-shadow:inset 0 0 0 1px var(--line)}
.day::before{content:"";display:block;height:6px;background:var(--flag);margin-bottom:8px}
.day .dn{font-size:12px;font-weight:600;color:var(--muted);padding:0 10px}
.day .dd{font-size:20px;font-weight:700;padding:0 10px;font-variant-numeric:tabular-nums}
.day .dc{font-size:12px;color:var(--muted);padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.is-today .dn{color:var(--accent)}
.day.is-past{opacity:.6}
.day[aria-pressed="true"]{background:var(--accent-soft)}

.quick{display:flex;gap:8px;margin-bottom:26px;background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-m);padding:6px}
.quick input{flex:1;border:0;background:none;padding:8px 10px;min-width:0}
.quick input:focus{outline:none}
.quick select{border:0;background:var(--bg);border-radius:var(--radius-s);padding:0 8px;max-width:38%}
.quick button{border:0;background:var(--ink);color:var(--bg);border-radius:var(--radius-s);padding:0 16px;font-weight:600}

.brain{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.brain-canvas{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden}
.brain-canvas svg{display:block;width:100%;height:max(460px,calc(100vh - 230px));touch-action:none}
.brain-tools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.brain-tools>*{pointer-events:auto}
.brain-tools input{flex:1 1 180px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:7px 10px;min-width:0}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);pointer-events:none}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.bpanel{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;max-height:calc(100vh - 150px);overflow-y:auto}
.bpanel h3{margin:0 0 2px;font-size:20px;letter-spacing:-.01em}
.bpanel .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bpanel .about{color:var(--muted);margin:8px 0 14px;font-size:14px;white-space:pre-wrap}
.bpanel h4{font-size:13px;margin:16px 0 4px;color:var(--muted)}
.bpanel .task{padding:8px 0}
.bpanel .task.p-high::before{left:-8px}
.nitem{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;text-align:left}
.nitem b{font-weight:600;display:flex;align-items:center;gap:7px}
.nitem span.t{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kd{width:8px;height:8px;border-radius:50%;flex:none}
.pl{display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;text-align:left;font-weight:500}
.pl .count{margin-left:auto;color:var(--muted);font-size:13px}
.bn text{font-family:inherit;pointer-events:none}
@media (max-width:1000px){.brain{grid-template-columns:1fr}.bpanel{max-height:none}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input{flex:1 1 220px;border:1px solid var(--line);background:var(--raised);border-radius:var(--radius-s);padding:8px 10px;min-width:0}
.filters select{border:1px solid var(--line);background:var(--raised);border-radius:var(--radius-s);padding:8px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip span{font-weight:500;opacity:.8}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
section{margin-bottom:28px}
.sh{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sh h2{font-size:15px;margin:0;font-weight:700}
.sh .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sh .act{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0}
.sh.danger h2{color:var(--danger)}
.empty{color:var(--muted);padding:10px 0;font-size:14px}

.task{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);position:relative}
.task.p-high::before{content:"";position:absolute;left:-10px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--f-red)}
.chk{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);background:none;margin-top:1px;display:grid;place-items:center;padding:0}
.chk:hover{border-color:var(--ok)}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.chk svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.task.done .chk svg{opacity:1}
.body{flex:1;min-width:0}
.title{border:0;background:none;padding:0;text-align:left;font-weight:500;display:block;width:100%;overflow-wrap:anywhere}
.task.done .title{text-decoration:line-through;color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:2px}
.meta .proj{display:inline-flex;align-items:center;gap:6px}
.meta .proj .dot{width:7px;height:7px}
.meta .late{color:var(--danger);font-weight:600}
.meta .soon{color:var(--warn);font-weight:600}
.meta .wait{color:var(--accent)}
.meta .stale{color:var(--warn)}
.tools{display:flex;gap:4px;flex:none;opacity:.35;transition:opacity .15s}
.task:hover .tools,.task:focus-within .tools{opacity:1}
.tool{border:1px solid var(--line);background:var(--raised);border-radius:var(--radius-s);font-size:12px;font-weight:600;padding:3px 8px;color:var(--muted)}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--raised)}

.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pcard{border:1px solid var(--line);background:var(--raised);border-radius:var(--radius-m);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--c)}
.pcard b{font-size:16px}
.pcard .pm{font-size:13px;color:var(--muted)}
.pcard .pm .late{color:var(--danger);font-weight:600}

.btn{border:1px solid var(--line);background:var(--raised);border-radius:var(--radius-s);padding:8px 14px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--danger)}

dialog{border:0;border-radius:14px;padding:0;background:var(--raised);color:var(--ink);width:min(520px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,18,.45)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-size:18px}
.dlg label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.dlg input,.dlg select,.dlg textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:9px 10px;font-weight:400;color:var(--ink);font-size:15px}
.dlg textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;gap:18px;flex-wrap:wrap}
.checks label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:14px}
.dlg .foot{display:flex;gap:8px;margin-top:4px}
.dlg .foot .spacer{flex:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--raised)}

.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font-size:34px;letter-spacing:-.02em}
.login input{border:1px solid var(--line);background:var(--raised);border-radius:var(--radius-s);padding:11px 12px}
.side-out{border:0;background:none;color:var(--faint);padding:14px 10px 0;font-size:13px;text-align:left;width:100%}
.notice{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius-s);font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}

.tabs{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding-top:18px}
  .tabs{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
  .tabs button{border:0;background:none;padding:8px 0;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabs button[aria-current="true"]{color:var(--accent)}
  .tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
  .strip{gap:3px}
  .day .dd{font-size:16px}
  .day .dn,.day .dd,.day .dc{padding:0 6px}
  .day .dc{font-size:11px}
  .tools{opacity:1}
  .head .right{margin-left:0;text-align:left}
  .bar{margin-left:0}
  .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main><div class="wrap" id="view"><div class="notice">Loading your tasks…</div></div></main>
</div>
<nav class="tabs" id="tabs"></nav>

<dialog id="taskDlg"><form class="dlg" id="taskForm" method="dialog">
  <h3 id="taskDlgTitle">Task</h3>
  <label>What needs doing<input name="title" required autocomplete="off"></label>
  <div class="row">
    <label>Project<select name="projectId"></select></label>
    <label>Status<select name="status">
      <option value="todo">To do</option><option value="doing">In progress</option>
      <option value="waiting">Waiting on someone</option><option value="suggested">Suggested by Claude</option><option value="done">Done</option></select></label>
  </div>
  <div class="row">
    <label>Deadline<input type="date" name="due"></label>
    <label>Priority<select name="priority"><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option></select></label>
  </div>
  <div class="checks">
    <label><input type="checkbox" name="onToday"> On today's list</label>
    <label><input type="checkbox" name="onWeek"> Finish this week</label>
  </div>
  <label>Notes<textarea name="notes"></textarea></label>
  <div class="foot">
    <button type="button" class="btn danger" id="delTask">Delete</button>
    <span class="spacer"></span>
    <button type="button" class="btn" data-close>Cancel</button>
    <button type="submit" class="btn primary">Save task</button>
  </div>
</form></dialog>

<dialog id="projDlg"><form class="dlg" id="projForm" method="dialog">
  <h3 id="projDlgTitle">Project</h3>
  <label>Name<input name="name" required autocomplete="off"></label>
  <label>Area<select name="area"><option>Career</option><option>Products</option><option>Life</option></select></label>
  <label>Colour<div class="swatches" id="swatches"></div></label>
  <div class="foot">
    <button type="button" class="btn danger" id="delProj">Delete</button>
    <span class="spacer"></span>
    <button type="button" class="btn" data-close>Cancel</button>
    <button type="submit" class="btn primary">Save project</button>
  </div>
</form></dialog>

<dialog id="noteDlg"><form class="dlg" id="noteForm" method="dialog">
  <h3 id="noteDlgTitle">Note</h3>
  <div class="row">
    <label>Type<select name="kind"><option value="note">Note</option><option value="idea">Idea</option><option value="decision">Decision</option><option value="person">Person</option><option value="link">Link</option><option value="fact">About (project description)</option></select></label>
    <label>Project<select name="projectId"></select></label>
  </div>
  <label>Title<input name="title" required autocomplete="off"></label>
  <label>Details<textarea name="body"></textarea></label>
  <label>Link (optional)<input name="url" type="url" placeholder="https://"></label>
  <div class="foot">
    <button type="button" class="btn danger" id="delNote">Delete</button>
    <span class="spacer"></span>
    <button type="button" class="btn" data-close>Cancel</button>
    <button type="submit" class="btn primary">Save note</button>
  </div>
</form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const COLORS=["#2F6DB5","#C4412F","#3E8A57","#E0A21A","#7A4FB0","#1F8A8A","#D0662A","#5E6E68","#B0407A"];
const FLAGS=["var(--f-blue)","var(--f-white)","var(--f-red)","var(--f-green)","var(--f-yellow)","var(--f-blue)","var(--f-white)"];
const AREAS=["Career","Products","Life"];
const PR={high:0,med:1,low:2};
const S={notes:[],bsel:"root",bopen:new Set(),bq:"",zt:null,q:"",fs:"open",sort:"due",db:null,projects:[],tasks:[],view:"today",pid:null,day:null,ready:{p:false,t:false}};

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const T=()=>iso(new Date());
function week(){const n=new Date();const m=new Date(n);m.setDate(n.getDate()-((n.getDay()+6)%7));return[...Array(7)].map((_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return iso(x)})}
const addDays=(s,k)=>{const d=parse(s);d.setDate(d.getDate()+k);return iso(d)};
const nice=s=>{const t=T();if(s===t)return"Today";if(s===addDays(t,1))return"Tomorrow";if(s===addDays(t,-1))return"Yesterday";const d=parse(s);return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})};
const now=()=>new Date().toISOString();

/* ---------- task logic ---------- */
const sugg=t=>t.status==="suggested";
const open=t=>t.status!=="done"&&!sugg(t);
const overdue=t=>open(t)&&t.due&&t.due<T();
const onToday=t=>open(t)&&(t.todayDate===T()||(t.due&&t.due<=T()));
const leftover=t=>open(t)&&t.todayDate&&t.todayDate<T()&&!onToday(t);
const inWeek=s=>{const w=week();return s&&s>=w[0]&&s<=w[6]};
const onWeek=t=>open(t)&&(t.weekOf===week()[0]||inWeek(t.due)||inWeek(t.todayDate)||overdue(t));
const doneOn=(t,d)=>t.status==="done"&&t.doneAt&&iso(new Date(t.doneAt))===d;
const doneThisWeek=t=>t.status==="done"&&t.doneAt&&inWeek(iso(new Date(t.doneAt)));
const stale=t=>open(t)&&t.status!=="waiting"&&t.updatedAt&&(Date.now()-new Date(t.updatedAt))>7*864e5;
const sortT=a=>a.slice().sort((x,y)=>(PR[x.priority||"med"]-PR[y.priority||"med"])||((x.due||"9")<(y.due||"9")?-1:(x.due||"9")>(y.due||"9")?1:0)||String(x.createdAt||"").localeCompare(String(y.createdAt||"")));
const proj=id=>S.projects.find(p=>p.id===id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- rendering ---------- */
const ICON={
 today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 week:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 projects:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
 suggested:'<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>',
 brain:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="5" r="2"/><circle cx="20" cy="5" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/><path d="M6 6l4 4M18 6l-4 4M6 18l4-4M18 18l-4-4"/></svg>',
 all:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 attention:'<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>'
};
function attentionCount(){return S.tasks.filter(t=>overdue(t)||stale(t)).length}

function renderSide(){
  const nav=[["today","Today",S.tasks.filter(onToday).length],["week","This week",S.tasks.filter(onWeek).length],["attention","Needs attention",attentionCount()],["suggested","Suggested by Claude",S.tasks.filter(sugg).length],["brain","Mind map",S.notes.length],["all","All tasks",S.tasks.filter(open).length]];
  let h=`<div class="brand">Task Hub<small>${esc(new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}))}</small></div><div class="nav">`;
  for(const[v,l,c] of nav) h+=`<button data-go="${v}" aria-current="${S.view===v}">${l}<span class="count ${v==="attention"&&c?"hot":v==="suggested"&&c?"new":""}">${c||""}</span></button>`;
  h+=`</div>`;
  for(const a of AREAS){
    const ps=S.projects.filter(p=>(p.area||"Life")===a).sort((x,y)=>(x.order??99)-(y.order??99)||x.name.localeCompare(y.name));
    if(!ps.length)continue;
    h+=`<div class="group-h">${a}</div><div class="nav">`;
    for(const p of ps){const ts=S.tasks.filter(t=>t.projectId===p.id&&open(t));const late=ts.filter(overdue).length;
      h+=`<button data-proj="${esc(p.id)}" aria-current="${S.view==="project"&&S.pid===p.id}"><span class="dot" style="background:${esc(p.color||COLORS[7])}"></span>${esc(p.name)}<span class="count ${late?"hot":""}">${ts.length||""}</span></button>`}
    h+=`</div>`;
  }
  const inbox=S.tasks.filter(t=>open(t)&&!proj(t.projectId)).length;
  if(inbox)h+=`<div class="nav"><button data-proj="__inbox" aria-current="${S.pid==="__inbox"}"><span class="dot" style="background:var(--faint)"></span>Unsorted<span class="count">${inbox}</span></button></div>`;
  h+=`<button class="side-add" data-newproj>+ New project</button><button class="side-out" data-signout>Sign out</button>`;
  document.getElementById("side").innerHTML=h;
  const tabs=[["today","Today"],["week","Week"],["projects","Projects"],["attention","Attention"],["suggested","Ideas"],["brain","Map"],["all","All"]];
  document.getElementById("tabs").innerHTML=tabs.map(([v,l])=>`<button data-go="${v}" aria-current="${S.view===v||(v==="projects"&&S.view==="project")}">${ICON[v]}${l}${v==="attention"&&attentionCount()?` (${attentionCount()})`:""}${v==="suggested"&&S.tasks.filter(sugg).length?` (${S.tasks.filter(sugg).length})`:""}</button>`).join("");
}

function strip(){
  const t=T();return `<div class="strip">`+week().map((d,i)=>{
    const due=S.tasks.filter(x=>open(x)&&(x.due===d||x.todayDate===d)).length;
    const dn=S.tasks.filter(x=>doneOn(x,d)).length;
    const cls=d===t?"is-today":d<t?"is-past":"";
    const lbl=[due?`${due} planned`:"",dn?`${dn} done`:""].filter(Boolean).join(", ")||"Free";
    return `<button class="day ${cls}" style="--flag:${FLAGS[i]}" data-day="${d}" aria-pressed="${S.day===d}"><div class="dn">${parse(d).toLocaleDateString(undefined,{weekday:"short"})}</div><div class="dd">${parse(d).getDate()}</div><div class="dc">${lbl}</div></button>`}).join("")+`</div>`;
}

function row(t){
  const p=proj(t.projectId);const bits=[];
  if(S.view!=="project"||S.pid!==t.projectId)bits.push(`<span class="proj"><span class="dot" style="background:${esc(p?.color||"var(--faint)")}"></span>${esc(p?.name||"Unsorted")}</span>`);
  if(t.due)bits.push(`<span class="${overdue(t)?"late":t.due<=addDays(T(),2)&&open(t)?"soon":""}">${overdue(t)?"Overdue, ":"Due "}${esc(nice(t.due))}</span>`);
  if(t.status==="waiting")bits.push(`<span class="wait">Waiting</span>`);
  if(t.status==="doing")bits.push(`<span>In progress</span>`);
  if(stale(t))bits.push(`<span class="stale">Untouched ${Math.floor((Date.now()-new Date(t.updatedAt))/864e5)} days</span>`);
  if(sugg(t)&&t.sourceChat)bits.push(`<span>From: ${esc(t.sourceChat)}</span>`);
  if(t.notes)bits.push(`<span>Has notes</span>`);
  const tools=sugg(t)?`<div class="tools" style="opacity:1"><button class="tool" data-accept="${esc(t.id)}" style="color:var(--ok)">Accept</button><button class="tool" data-dismiss="${esc(t.id)}">Dismiss</button></div>`:open(t)?`<div class="tools"><button class="tool" data-tog="today" data-id="${esc(t.id)}" aria-pressed="${t.todayDate===T()}" title="Put on today's list">Today</button><button class="tool" data-tog="week" data-id="${esc(t.id)}" aria-pressed="${t.weekOf===week()[0]}" title="Finish this week">Week</button></div>`:"";
  return `<div class="task ${t.status==="done"?"done":""} p-${esc(t.priority||"med")}">${sugg(t)?`<span class="chk" style="border-style:dashed" aria-hidden="true"></span>`:`<button class="chk"`} data-done="${esc(t.id)}" aria-label="${t.status==="done"?"Mark not done":"Mark done"}">${sugg(t)?"":`<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>`}<div class="body"><button class="title" data-edit="${esc(t.id)}">${esc(t.title)}</button><div class="meta">${bits.join("")}</div></div>${tools}</div>`;
}
function sec(title,list,{empty="",action="",cls=""}={}){
  if(!list.length&&!empty)return"";
  return `<section><div class="sh ${cls}"><h2>${title}</h2><span class="n">${list.length||""}</span>${action}</div>${list.length?list.map(row).join(""):`<div class="empty">${empty}</div>`}</section>`;
}
function quick(ph){
  const opts=`<option value="">Unsorted</option>`+AREAS.map(a=>{const ps=S.projects.filter(p=>(p.area||"Life")===a);return ps.length?`<optgroup label="${a}">${ps.map(p=>`<option value="${esc(p.id)}" ${S.view==="project"&&S.pid===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</optgroup>`:""}).join("");
  return `<form class="quick" id="quick"><input name="q" placeholder="${ph}" autocomplete="off" aria-label="New task"><select name="p" aria-label="Project">${opts}</select><button type="submit">Add</button></form>`;
}
function progress(done,total,label){const pct=total?Math.round(done/total*100):0;return `<div class="right"><div class="meter">${done}<span> of ${total} ${label}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}

function renderView(){
  const v=document.getElementById("view");const t=T();let h="";
  if(S.view==="today"){
    const list=sortT(S.tasks.filter(onToday));const doneT=S.tasks.filter(x=>doneOn(x,t));
    const left=sortT(S.tasks.filter(leftover));
    h+=`<div class="head"><div><h1>Today</h1><div class="sub">${esc(parse(t).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}))}</div></div>${progress(doneT.length,doneT.length+list.length,"done")}</div>`;
    h+=strip()+quick("Add something for today");
    if(S.day&&S.day!==t){const dl=sortT(S.tasks.filter(x=>open(x)&&(x.due===S.day||x.todayDate===S.day)));h+=sec(`Planned for ${esc(nice(S.day))}`,dl,{empty:"Nothing planned for this day."});}
    h+=sec("To do today",list,{empty:"Your list for today is clear. Pull something in from This week or a project."});
    h+=sec("Left from earlier",left,{action:left.length?`<button class="act" data-carry>Move all to today</button>`:""});
    h+=sec("Done today",doneT);
  }
  else if(S.view==="week"){
    const w=week();const openW=S.tasks.filter(onWeek);const doneW=S.tasks.filter(doneThisWeek);
    h+=`<div class="head"><div><h1>Finish this week</h1><div class="sub">${esc(nice(w[0]))} to ${esc(nice(w[6]))}</div></div>${progress(doneW.length,doneW.length+openW.length,"finished")}</div>`;
    h+=strip()+quick("Add something to finish this week");
    const days=S.day?[S.day]:w;
    h+=sec("Overdue",sortT(openW.filter(overdue)),{cls:"danger"});
    for(const d of days){const l=sortT(openW.filter(x=>!overdue(x)&&(x.due===d||(!x.due&&x.todayDate===d))));if(l.length||d===t)h+=sec(d===t?"Today":esc(nice(d)),l,{empty:"Nothing scheduled."})}
    if(!S.day)h+=sec("Anytime this week",sortT(openW.filter(x=>!overdue(x)&&!inWeek(x.due)&&!inWeek(x.todayDate))),{empty:"Tap Week on any task to add it here."});
    h+=sec("Finished this week",S.tasks.filter(doneThisWeek));
  }
  else if(S.view==="attention"){
    h+=`<div class="head"><div><h1>Needs attention</h1><div class="sub">Overdue, stalled, or waiting on someone else</div></div></div>`;
    h+=sec("Overdue",sortT(S.tasks.filter(overdue)),{cls:"danger",empty:"Nothing overdue."});
    h+=sec("Untouched for a week or more",sortT(S.tasks.filter(x=>stale(x)&&!overdue(x))),{empty:"Everything has moved in the last 7 days."});
    h+=sec("Waiting on someone",sortT(S.tasks.filter(x=>x.status==="waiting")),{empty:"Not waiting on anyone."});
  }
  else if(S.view==="suggested"){
    const ss=S.tasks.filter(sugg);
    h+=`<div class="head"><div><h1>Suggested by Claude</h1><div class="sub">Next steps Claude recommended in your chats. Accept to add them to your list.</div></div>${ss.length?`<div class="right"><button class="btn" data-acceptall>Accept all</button></div>`:""}</div>`;
    if(!ss.length)h+=`<div class="empty">No suggestions waiting. New ones appear here as you chat.</div>`;
    for(const p of S.projects)h+=sec(esc(p.name),sortT(ss.filter(t=>t.projectId===p.id)));
    h+=sec("Unsorted",sortT(ss.filter(t=>!proj(t.projectId))));
  }
  else if(S.view==="brain"){
    h+=`<div class="head"><div><h1>Mind map</h1><div class="sub">Your world by area and project: tasks, people, ideas, decisions and notes</div></div><div class="right"><button class="btn primary" data-addnote="${S.bsel.startsWith("p:")?esc(S.bsel.slice(2)):""}">Add note</button></div></div>`;
    h+=`<div class="brain"><div class="brain-canvas"><div class="brain-tools"><input id="bsearch" type="search" placeholder="Search your brain" value="${esc(S.bq)}" aria-label="Search the mind map"><button class="btn" data-bexpand>Expand all</button><button class="btn" data-bcollapse>Collapse</button><button class="btn" data-bfit>Recenter</button></div><svg id="brainSvg" role="img" aria-label="Mind map of your projects, tasks and notes"></svg><div class="legend">${Object.entries(KIND).map(([k,v])=>`<span><i style="background:${v.c}"></i>${v.l}</span>`).join("")}<span><i style="background:var(--raised);box-shadow:inset 0 0 0 2px var(--muted)"></i>Task</span><span><i style="background:var(--danger)"></i>Overdue</span></div></div><div class="bpanel" id="bpanel">${brainPanel()}</div></div>`;
  }
  else if(S.view==="projects"){
    h+=`<div class="head"><div><h1>Projects</h1></div><div class="right"><button class="btn" data-newproj>New project</button></div></div>`;
    for(const a of AREAS){const ps=S.projects.filter(p=>(p.area||"Life")===a);if(!ps.length)continue;
      h+=`<section><div class="sh"><h2>${a}</h2></div><div class="proj-grid">`+ps.map(p=>{const ts=S.tasks.filter(t=>t.projectId===p.id);const o=ts.filter(open);const late=o.filter(overdue).length;const nd=sortT(o.filter(x=>x.due))[0];
        return `<button class="pcard" style="--c:${esc(p.color||COLORS[7])}" data-proj="${esc(p.id)}"><b>${esc(p.name)}</b><span class="pm">${o.length} open${late?`, <span class="late">${late} overdue</span>`:""}</span><span class="pm">${nd?`Next deadline ${esc(nice(nd.due))}`:"No deadlines"}</span></button>`}).join("")+`</div></section>`}
  }
  else if(S.view==="project"){
    const inbox=S.pid==="__inbox";const p=proj(S.pid);
    const ts=S.tasks.filter(t=>inbox?!proj(t.projectId):t.projectId===S.pid);
    h+=`<div class="head"><div><h1>${esc(inbox?"Unsorted":p?.name||"Project")}</h1><div class="sub">${esc(inbox?"Tasks without a project":p?.area||"")}</div></div><div class="right">${p?`<button class="btn" data-editproj="${esc(p.id)}">Edit project</button>`:""}</div></div>`;
    h+=quick(`Add a task${p?` to ${esc(p.name)}`:""}`);
    h+=sec("Suggested by Claude",sortT(ts.filter(sugg)));
    h+=sec("Overdue",sortT(ts.filter(overdue)),{cls:"danger"});
    h+=sec("In progress",sortT(ts.filter(x=>x.status==="doing"&&!overdue(x))));
    h+=sec("To do",sortT(ts.filter(x=>x.status==="todo"&&!overdue(x))),{empty:"No open tasks here."});
    h+=sec("Waiting on someone",sortT(ts.filter(x=>x.status==="waiting"&&!overdue(x))));
    h+=sec("Done",ts.filter(x=>x.status==="done").sort((a,b)=>String(b.doneAt).localeCompare(String(a.doneAt))).slice(0,15));
  }
  else{
    const fc={open:S.tasks.filter(open).length,suggested:S.tasks.filter(sugg).length,done:S.tasks.filter(x=>x.status==="done").length,all:S.tasks.length};
    h+=`<div class="head"><div><h1>All tasks</h1><div class="sub">Every task across every project in one list</div></div></div>`+quick("Add a task");
    h+=`<div class="filters"><input id="search" type="search" placeholder="Search tasks, notes or projects" value="${esc(S.q)}" aria-label="Search"><div class="chips">${[["open","Open"],["suggested","Suggested"],["done","Done"],["all","Everything"]].map(([k,l])=>`<button class="chip" data-fs="${k}" aria-pressed="${S.fs===k}">${l} <span>${fc[k]}</span></button>`).join("")}</div><select id="sortSel" aria-label="Sort">${[["due","Sort by deadline"],["priority","Sort by priority"],["project","Sort by project"],["recent","Recently updated"]].map(([k,l])=>`<option value="${k}" ${S.sort===k?"selected":""}>${l}</option>`).join("")}</select></div><div id="allList">${allList()}</div>`;
  }
  v.innerHTML=h;
  if(S.view==="brain")requestAnimationFrame(drawBrain);
}
/* ---------- mind map ---------- */
const KIND={fact:{l:"About",c:"var(--faint)"},person:{l:"Person",c:"var(--accent)"},decision:{l:"Decision",c:"var(--f-green)"},idea:{l:"Idea",c:"var(--f-yellow)"},link:{l:"Link",c:"var(--f-blue)"},note:{l:"Note",c:"var(--ink)"}};
const KORD=Object.keys(KIND);
const trunc=(s,n)=>{s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s};
function brainTree(){
  const q=S.bq.trim().toLowerCase();const hit=s=>!!q&&String(s||"").toLowerCase().includes(q);
  const root={id:"root",type:"root",name:"Vimal",children:[]};
  const nn=(n,color)=>({id:"n:"+n.id,type:"note",name:n.title,note:n,color,match:hit(n.title)||hit(n.body)});
  for(const a of AREAS){
    const ps=S.projects.filter(p=>(p.area||"Life")===a).sort((x,y)=>(x.order??99)-(y.order??99)||x.name.localeCompare(y.name));
    if(!ps.length)continue;
    const an={id:"area:"+a,type:"area",name:a,children:[]};
    for(const p of ps){
      const ns=S.notes.filter(n=>n.projectId===p.id).sort((x,y)=>KORD.indexOf(x.kind)-KORD.indexOf(y.kind));
      const ts=sortT(S.tasks.filter(t=>t.projectId===p.id&&(open(t)||sugg(t))));
      const kids=[...ns.map(n=>nn(n,p.color)),...ts.map(t=>({id:"t:"+t.id,type:"task",name:t.title,task:t,color:p.color,match:hit(t.title)||hit(t.notes)}))];
      const pn={id:"p:"+p.id,type:"project",name:p.name,proj:p,color:p.color||COLORS[7],count:ts.length,late:ts.filter(overdue).length,match:hit(p.name)};
      if(kids.length&&(S.bopen.has(pn.id)||(q&&kids.some(k=>k.match))))pn.children=kids;
      pn.hasKids=kids.length>0;
      an.children.push(pn);
    }
    root.children.push(an);
  }
  const loose=S.notes.filter(n=>!proj(n.projectId));
  const pe=loose.filter(n=>n.kind==="person"),ot=loose.filter(n=>n.kind!=="person");
  if(pe.length)root.children.push({id:"area:People",type:"area",name:"People",children:pe.map(n=>nn(n))});
  if(ot.length)root.children.push({id:"area:Loose",type:"area",name:"Loose notes",children:ot.map(n=>nn(n))});
  return root;
}
function drawBrain(){
  const svgEl=document.getElementById("brainSvg");if(!svgEl||!window.d3)return;
  const svg=d3.select(svgEl);const W=svgEl.clientWidth,H=svgEl.clientHeight;
  svg.selectAll("*").remove();
  const g=svg.append("g");
  const R=[0,125,285,455];
  const hr=d3.hierarchy(brainTree(),d=>d.children);
  d3.tree().size([2*Math.PI,1]).separation((a,b)=>(a.parent===b.parent?1:2)/Math.max(a.depth,1))(hr);
  hr.each(d=>{d.rr=R[Math.min(d.depth,3)]});
  const pt=d=>[d.rr*Math.cos(d.x-Math.PI/2),d.rr*Math.sin(d.x-Math.PI/2)];
  g.append("g").selectAll("path").data(hr.links()).join("path")
    .attr("fill","none").attr("stroke",d=>d.target.data.color||"var(--faint)")
    .attr("stroke-opacity",d=>d.target.depth>2?.4:.65).attr("stroke-width",d=>d.target.depth>2?1:d.target.depth>1?1.6:2.2)
    .attr("d",d3.linkRadial().angle(d=>d.x).radius(d=>d.rr));
  const q=S.bq.trim();
  const node=g.append("g").selectAll("g").data(hr.descendants()).join("g")
    .attr("class","bn").attr("transform",d=>`translate(${pt(d)})`).style("cursor","pointer")
    .attr("opacity",d=>q&&d.depth>1&&!d.data.match&&!(d.children||[]).some(c=>c.data.match)?.35:1);
  const rad=d=>({root:24,area:12,project:d.data.hasKids?9:7}[d.data.type]||5);
  node.append("circle").attr("r",rad)
    .attr("fill",d=>{const x=d.data;if(x.type==="root")return"var(--ink)";if(x.type==="area")return"var(--raised)";if(x.type==="project")return x.children||!x.hasKids?x.color:"var(--raised)";if(x.type==="task")return overdue(x.task)?"var(--danger)":"var(--raised)";return KIND[x.note.kind]?.c||"var(--ink)"})
    .attr("stroke",d=>{const x=d.data;if(x.id===S.bsel)return"var(--accent)";if(x.type==="area")return"var(--ink)";if(x.type==="task")return overdue(x.task)?"var(--danger)":"var(--muted)";return x.color||"var(--ink)"})
    .attr("stroke-width",d=>d.data.id===S.bsel?3.5:d.data.type==="project"?2.5:1.5)
    .attr("stroke-dasharray",d=>d.data.type==="task"&&sugg(d.data.task)?"2 2":null);
  node.filter(d=>d.depth===0).append("text").text("Vimal").attr("text-anchor","middle").attr("dy","0.35em").attr("fill","var(--bg)").attr("font-size",11).attr("font-weight",700);
  node.filter(d=>d.depth>0).append("text")
    .text(d=>{const x=d.data;if(x.type==="project")return trunc(x.name,22)+(x.count?`  ${x.count}`:"");return trunc(x.name,d.depth>2?32:22)})
    .attr("x",d=>{const right=Math.cos(d.x-Math.PI/2)>=-0.05;return(right?1:-1)*(rad(d)+6)})
    .attr("text-anchor",d=>Math.cos(d.x-Math.PI/2)>=-0.05?"start":"end").attr("dy","0.35em")
    .attr("font-size",d=>d.depth===1?15:d.depth===2?13:12)
    .attr("font-weight",d=>d.data.match?800:d.depth===1?800:d.depth===2?600:400)
    .attr("fill",d=>d.data.match?"var(--accent)":d.data.type==="task"?(overdue(d.data.task)?"var(--danger)":"var(--muted)"):"var(--ink)")
    .attr("paint-order","stroke").attr("stroke","var(--raised)").attr("stroke-width",4).attr("stroke-linejoin","round");
  node.append("title").text(d=>d.data.name);
  const z=d3.zoom().extent([[0,0],[W||1,H||1]]).scaleExtent([.25,3]).on("zoom",e=>{g.attr("transform",e.transform);S.zt=e.transform});
  svg.call(z).on("dblclick.zoom",null);
  const fit=d3.zoomIdentity.translate(W/2,H/2).scale(Math.max(.3,Math.min(W,H)/1250));
  svg.call(z.transform,S.zt||fit);
  S.brainFit=()=>{S.zt=null;svg.transition().duration(350).call(z.transform,fit)};
  node.on("click",(e,d)=>{e.stopPropagation();brainSelect(d.data.id)});
}
function brainSelect(id){
  if(id.startsWith("p:")){if(S.bsel===id){S.bopen.has(id)?S.bopen.delete(id):S.bopen.add(id)}else S.bopen.add(id)}
  S.bsel=id;
  const p=document.getElementById("bpanel");if(p)p.innerHTML=brainPanel();
  drawBrain();
}
function noteItem(n){return `<button class="nitem" data-bsel="n:${esc(n.id)}"><b><span class="kd" style="background:${KIND[n.kind]?.c||"var(--ink)"}"></span>${esc(n.title)}</b>${n.body?`<span class="t">${esc(n.body)}</span>`:""}</button>`}
function brainPanel(){
  const id=S.bsel||"root";
  if(id.startsWith("p:")){
    const p=proj(id.slice(2));if(!p){S.bsel="root";return brainPanel()}
    const ns=S.notes.filter(n=>n.projectId===p.id);const about=ns.filter(n=>n.kind==="fact");
    const people=ns.filter(n=>n.kind==="person"),rest=ns.filter(n=>n.kind!=="fact"&&n.kind!=="person").sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
    const ts=sortT(S.tasks.filter(t=>t.projectId===p.id&&(open(t)||sugg(t))));
    return `<div class="k">${esc(p.area||"")}</div><h3><span class="dot" style="display:inline-block;background:${esc(p.color)};margin-right:8px;vertical-align:3px"></span>${esc(p.name)}</h3>${about.map(n=>`<div class="about">${esc(n.body)}</div>`).join("")||`<div class="about">No description yet.</div>`}
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-addnote="${esc(p.id)}">Add note</button><button class="btn" data-proj="${esc(p.id)}">Open project</button></div>
      ${people.length?`<h4>People</h4>${people.map(noteItem).join("")}`:""}
      <h4>Open tasks (${ts.length})</h4>${ts.length?ts.map(row).join(""):`<div class="empty">No open tasks.</div>`}
      ${rest.length?`<h4>Notes, ideas and decisions</h4>${rest.map(noteItem).join("")}`:""}`;
  }
  if(id.startsWith("n:")){
    const n=S.notes.find(x=>x.id===id.slice(2));if(!n){S.bsel="root";return brainPanel()}
    const p=proj(n.projectId);
    return `<div class="k">${esc(KIND[n.kind]?.l||"Note")}${p?` · ${esc(p.name)}`:""}</div><h3>${esc(n.title)}</h3><div class="about" style="color:var(--ink)">${esc(n.body)||"<span style='color:var(--muted)'>No details.</span>"}</div>${n.url?`<p><a href="${esc(n.url)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(trunc(n.url,48))}</a></p>`:""}<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-editnote="${esc(n.id)}">Edit</button>${p?`<button class="btn" data-bsel="p:${esc(p.id)}">Back to ${esc(p.name)}</button>`:""}</div><p class="k" style="margin-top:14px;text-transform:none;letter-spacing:0;font-weight:500">Added ${esc(new Date(n.createdAt).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}))}${n.source&&n.source!=="seed"?` from ${esc(n.source)}`:""}</p>`;
  }
  if(id.startsWith("t:")){
    const t=S.tasks.find(x=>x.id===id.slice(2));if(!t){S.bsel="root";return brainPanel()}
    return `<div class="k">Task</div>${row(t)}${t.notes?`<div class="about">${esc(t.notes)}</div>`:""}${t.projectId?`<button class="btn" data-bsel="p:${esc(t.projectId)}">Back to ${esc(proj(t.projectId)?.name||"project")}</button>`:""}`;
  }
  if(id.startsWith("area:")){
    const a=id.slice(5);
    if(a==="People"||a==="Loose"){const ns=S.notes.filter(n=>!proj(n.projectId)&&(a==="People"?n.kind==="person":n.kind!=="person"));return `<div class="k">Branch</div><h3>${a==="People"?"People":"Loose notes"}</h3>${ns.map(noteItem).join("")}`}
    const ps=S.projects.filter(p=>(p.area||"Life")===a);
    return `<div class="k">Area</div><h3>${esc(a)}</h3>${ps.map(p=>{const o=S.tasks.filter(t=>t.projectId===p.id&&open(t));const l=o.filter(overdue).length;return `<button class="pl" data-bsel="p:${esc(p.id)}"><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}<span class="count">${o.length} open${l?`, <span style="color:var(--danger);font-weight:600">${l} late</span>`:""}</span></button>`}).join("")}`;
  }
  const o=S.tasks.filter(open),late=o.filter(overdue).length;
  const recent=S.notes.slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,6);
  return `<div class="k">Everything</div><h3>Your world</h3><div class="about">${S.projects.length} projects, ${o.length} open tasks${late?` (${late} overdue)`:""}, ${S.notes.length} notes. Tap a project to open its branch, tap again to fold it.</div><h4>Latest notes</h4>${recent.map(noteItem).join("")||`<div class="empty">No notes yet.</div>`}`;
}
function allList(){
  const q=S.q.trim().toLowerCase();
  let l=S.tasks.filter(t=>S.fs==="all"?true:S.fs==="open"?open(t):S.fs==="suggested"?sugg(t):t.status==="done");
  if(q)l=l.filter(t=>(t.title+" "+(t.notes||"")+" "+(proj(t.projectId)?.name||"Unsorted")).toLowerCase().includes(q));
  const dk=t=>t.due||"9999";
  const cmp={due:(a,b)=>dk(a).localeCompare(dk(b))||PR[a.priority||"med"]-PR[b.priority||"med"],
    priority:(a,b)=>PR[a.priority||"med"]-PR[b.priority||"med"]||dk(a).localeCompare(dk(b)),
    project:(a,b)=>(proj(a.projectId)?.name||"~").localeCompare(proj(b.projectId)?.name||"~")||dk(a).localeCompare(dk(b)),
    recent:(a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||""))}[S.sort];
  l=l.slice().sort(cmp);
  return l.length?`<section><div class="sh"><h2>${l.length} task${l.length===1?"":"s"}</h2></div>${l.map(row).join("")}</section>`:`<div class="empty">${q?"No tasks match that search.":"Nothing here."}</div>`;
}
function render(){if(!S.ready.p||!S.ready.t)return;const a=document.activeElement,fid=a&&(a.id==="search"||a.id==="bsearch")?a.id:null,pos=fid?a.selectionStart:0;renderSide();renderView();if(fid){const s=document.getElementById(fid);if(s){s.focus();s.setSelectionRange(pos,pos)}}}

/* ---------- writes ---------- */
let toastTimer;function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove("show"),2200)}
async function upd(id,patch){try{await S.db.doc("tasks/"+id).update({...patch,updatedAt:now()})}catch(e){toast(e.code==="invalid_argument"?"You can view this list but not change it.":"That change didn't save. Try again.")}}
async function addTask(data){try{await S.db.collection("tasks").add({status:"todo",priority:"med",createdAt:now(),updatedAt:now(),source:"hub",...data})}catch(e){toast(e.code==="quota_exceeded"?"Storage is full. Delete some finished tasks first.":"Couldn't add that task. Try again.")}}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.go){S.view=b.dataset.go;S.pid=null;S.day=null;render();document.querySelector("main").scrollTo(0,0);return}
  if(b.dataset.proj){S.view="project";S.pid=b.dataset.proj;S.day=null;render();document.querySelector("main").scrollTo(0,0);return}
  if("signout" in b.dataset){await sb.auth.signOut();location.reload();return}
  if(b.dataset.bsel){brainSelect(b.dataset.bsel);return}
  if("bexpand" in b.dataset){S.projects.forEach(p=>S.bopen.add("p:"+p.id));drawBrain();return}
  if("bcollapse" in b.dataset){S.bopen.clear();drawBrain();return}
  if("bfit" in b.dataset){S.brainFit&&S.brainFit();return}
  if("addnote" in b.dataset){openNote(null,b.dataset.addnote||null);return}
  if(b.dataset.editnote){openNote(S.notes.find(n=>n.id===b.dataset.editnote));return}
  if(b.dataset.fs){S.fs=b.dataset.fs;render();return}
  if(b.dataset.day){S.day=S.day===b.dataset.day?null:b.dataset.day;render();return}
  if(b.dataset.done){const t=S.tasks.find(x=>x.id===b.dataset.done);if(!t)return;const d=t.status==="done";await upd(t.id,d?{status:"todo",doneAt:null}:{status:"done",doneAt:now()});if(!d)toast("Marked done");return}
  if(b.dataset.tog){const t=S.tasks.find(x=>x.id===b.dataset.id);if(!t)return;
    if(b.dataset.tog==="today")await upd(t.id,{todayDate:t.todayDate===T()?null:T()});
    else await upd(t.id,{weekOf:t.weekOf===week()[0]?null:week()[0]});return}
  if("carry" in b.dataset){for(const t of S.tasks.filter(leftover))await upd(t.id,{todayDate:T()});toast("Moved to today");return}
  if(b.dataset.accept){await upd(b.dataset.accept,{status:"todo"});toast("Added to your list");return}
  if(b.dataset.dismiss){try{await S.db.doc("tasks/"+b.dataset.dismiss).delete();toast("Suggestion dismissed")}catch{toast("Couldn't dismiss that suggestion.")}return}
  if("acceptall" in b.dataset){for(const t of S.tasks.filter(sugg))await upd(t.id,{status:"todo"});toast("All suggestions added");return}
  if(b.dataset.edit){openTask(S.tasks.find(x=>x.id===b.dataset.edit));return}
  if("newproj" in b.dataset){openProj(null);return}
  if(b.dataset.editproj){openProj(proj(b.dataset.editproj));return}
  if("close" in b.dataset){b.closest("dialog").close();return}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="quick")return;e.preventDefault();
  const f=e.target;const title=f.q.value.trim();if(!title)return;
  const data={title,projectId:f.p.value||null};
  if(S.view==="today")data.todayDate=S.day&&S.day!==T()?S.day:T();
  if(S.view==="week"){data.weekOf=week()[0];if(S.day)data.due=S.day}
  f.q.value="";await addTask(data);toast("Task added");f.q.focus();
});

document.addEventListener("input",e=>{if(e.target.id==="bsearch"){S.bq=e.target.value;drawBrain();return}if(e.target.id==="search"){S.q=e.target.value;document.getElementById("allList").innerHTML=allList()}});
document.addEventListener("change",e=>{if(e.target.id==="sortSel"){S.sort=e.target.value;document.getElementById("allList").innerHTML=allList()}});
/* task dialog */
let editing=null;
function projOptions(sel){return `<option value="">Unsorted</option>`+S.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===sel?"selected":""}>${esc(p.name)}</option>`).join("")}
function openTask(t){
  editing=t;const f=document.getElementById("taskForm");
  document.getElementById("taskDlgTitle").textContent=t?"Edit task":"New task";
  f.title.value=t?.title||"";f.projectId.innerHTML=projOptions(t?.projectId);f.status.value=t?.status||"todo";
  f.due.value=t?.due||"";f.priority.value=t?.priority||"med";f.onToday.checked=t?.todayDate===T();f.onWeek.checked=t?.weekOf===week()[0];f.notes.value=t?.notes||"";
  document.getElementById("delTask").hidden=!t;document.getElementById("taskDlg").showModal();
}
document.getElementById("taskForm").addEventListener("submit",async e=>{
  const f=e.target;const st=f.status.value;
  const data={title:f.title.value.trim(),projectId:f.projectId.value||null,status:st,due:f.due.value||null,priority:f.priority.value,
    todayDate:f.onToday.checked?T():(editing?.todayDate===T()?null:editing?.todayDate||null),
    weekOf:f.onWeek.checked?week()[0]:(editing?.weekOf===week()[0]?null:editing?.weekOf||null),notes:f.notes.value.trim()};
  if(!data.title)return;
  if(editing){if(st==="done"&&editing.status!=="done")data.doneAt=now();if(st!=="done")data.doneAt=null;await upd(editing.id,data);toast("Task saved")}
  else{if(st==="done")data.doneAt=now();await addTask(data);toast("Task added")}
});
document.getElementById("delTask").addEventListener("click",async()=>{if(!editing)return;if(!confirm("Delete this task?"))return;try{await S.db.doc("tasks/"+editing.id).delete();toast("Task deleted")}catch{toast("Couldn't delete that task.")}document.getElementById("taskDlg").close()});

/* note dialog */
let editingN=null;
function openNote(n,pid){
  editingN=n;const f=document.getElementById("noteForm").elements;
  document.getElementById("noteDlgTitle").textContent=n?"Edit note":"New note";
  f.kind.value=n?.kind||"note";f.projectId.innerHTML=projOptions(n?n.projectId:pid).replace(">Unsorted<",">No project<");
  f.title.value=n?.title||"";f.body.value=n?.body||"";f.url.value=n?.url||"";
  document.getElementById("delNote").hidden=!n;document.getElementById("noteDlg").showModal();
}
document.getElementById("noteForm").addEventListener("submit",async e=>{
  const f=e.target.elements;const data={kind:f.kind.value,projectId:f.projectId.value||null,title:f.title.value.trim(),body:f.body.value.trim(),url:f.url.value.trim()||null};
  if(!data.title)return;
  try{if(editingN)await S.db.doc("notes/"+editingN.id).update(data);else await S.db.collection("notes").add({...data,source:"hub"});toast("Note saved")}catch{toast("Couldn't save that note. Try again.")}
});
document.getElementById("delNote").addEventListener("click",async()=>{if(!editingN)return;if(!confirm("Delete this note?"))return;
  try{await S.db.doc("notes/"+editingN.id).delete();if(S.bsel==="n:"+editingN.id)S.bsel="root";toast("Note deleted")}catch{toast("Couldn't delete that note.")}document.getElementById("noteDlg").close()});
/* project dialog */
let editingP=null,pColor=COLORS[0];
function openProj(p){
  editingP=p;const f=document.getElementById("projForm");
  document.getElementById("projDlgTitle").textContent=p?"Edit project":"New project";
  f.name.value=p?.name||"";f.area.value=p?.area||"Life";pColor=p?.color||COLORS[S.projects.length%COLORS.length];drawSw();
  document.getElementById("delProj").hidden=!p;document.getElementById("projDlg").showModal();
}
function drawSw(){document.getElementById("swatches").innerHTML=COLORS.map(c=>`<button type="button" style="--c:${c}" data-sw="${c}" aria-label="Colour ${c}" aria-pressed="${c===pColor}"></button>`).join("")}
document.getElementById("swatches").addEventListener("click",e=>{const b=e.target.closest("[data-sw]");if(b){pColor=b.dataset.sw;drawSw()}});
document.getElementById("projForm").addEventListener("submit",async e=>{
  const f=e.target;const name=f.name.value.trim();if(!name)return;
  const data={name,area:f.area.value,color:pColor,updatedAt:now()};
  try{if(editingP)await S.db.doc("projects/"+editingP.id).update(data);
    else{const id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||("p-"+Date.now());await S.db.doc("projects/"+id).set({...data,order:99,createdAt:now()})}
    toast("Project saved")}catch{toast("Couldn't save that project.")}
});
document.getElementById("delProj").addEventListener("click",async()=>{if(!editingP)return;if(!confirm("Delete this project? Its tasks move to Unsorted."))return;
  try{await S.db.doc("projects/"+editingP.id).delete();S.view="projects";S.pid=null;toast("Project deleted")}catch{toast("Couldn't delete that project.")}document.getElementById("projDlg").close()});

/* ---------- boot: Supabase ---------- */
const SB_URL="https://mbbucsageoyxhekzbmyq.supabase.co";
const SB_KEY="sb_publishable_mVoEHUZ40dF4cp-jRF__IA_hObDMvif";
const sb=supabase.createClient(SB_URL,SB_KEY);
const MAP={projectId:"project_id",todayDate:"today_date",weekOf:"week_of",sourceChat:"source_chat",doneAt:"done_at",createdAt:"created_at",updatedAt:"updated_at"};
const RMAP=Object.fromEntries(Object.entries(MAP).map(([a,b])=>[b,a]));
const toRow=o=>{const r={};for(const[k,v]of Object.entries(o)){if(k==="updatedAt")continue;r[MAP[k]||k]=v===""&&(k==="due"||k==="todayDate"||k==="weekOf")?null:v}return r};
const fromRow=o=>{const r={};for(const[k,v]of Object.entries(o))r[RMAP[k]||k]=v;return r};
const ok=({error})=>{if(error)throw error};
S.db={
  doc(path){const[t,id]=path.split("/");return{
    update:async d=>{ok(await sb.from(t).update(toRow(d)).eq("id",id));soon()},
    set:async d=>{ok(await sb.from(t).upsert({id,...toRow(d)}));soon()},
    delete:async()=>{ok(await sb.from(t).delete().eq("id",id));soon()}}},
  collection(t){return{add:async d=>{ok(await sb.from(t).insert(toRow(d)));soon()}}}
};
async function refresh(){
  const[p,t,n]=await Promise.all([sb.from("projects").select("*"),sb.from("tasks").select("*"),sb.from("notes").select("*")]);
  if(!n.error)S.notes=n.data.map(fromRow);
  if(p.error||t.error){document.getElementById("view").innerHTML=`<div class="notice">Your tasks couldn't load. Reload the page to try again.</div>`;return}
  S.projects=p.data.map(fromRow);S.tasks=t.data.map(fromRow);S.ready.p=S.ready.t=true;render();
}
let rt;function soon(){clearTimeout(rt);rt=setTimeout(refresh,120)}
function showLogin(msg){
  document.getElementById("side").innerHTML="";document.getElementById("tabs").innerHTML="";
  document.getElementById("view").innerHTML=`<form class="login" id="loginForm"><h1>Task Hub</h1><div class="sub" style="color:var(--muted)">${msg||"Sign in with your email. We'll send you a link."}</div><input type="email" name="email" required placeholder="you@example.com" autocomplete="email" aria-label="Email"><button class="btn primary" type="submit">Send sign-in link</button></form>`;
  document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();
    const email=e.target.email.value.trim();
    const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});
    showLogin(error?"That email can't sign in here. Check the address and try again.":"Check your inbox and tap the link to sign in.")});
}
let started=false;
async function start(){
  if(started)return;started=true;
  await refresh();
  sb.channel("hub").on("postgres_changes",{event:"*",schema:"public",table:"tasks"},soon).on("postgres_changes",{event:"*",schema:"public",table:"projects"},soon).on("postgres_changes",{event:"*",schema:"public",table:"notes"},soon).subscribe();
  let last=T();setInterval(()=>{if(T()!==last){last=T();render()}},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)soon()});
}
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session)start();else showLogin();
  sb.auth.onAuthStateChange((ev,s)=>{if(s&&!started)start()});
})();
</script>
