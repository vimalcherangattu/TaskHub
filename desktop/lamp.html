<title>Vilakku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["overlay", "shortcuts", "notifications", "menu-bar"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a fixed 360x640 stage. The brass lamp stands at the bottom, its speech card floats above it.
   On the desktop the window is see-through and clicks pass through everything except the lamp and the card. */
:root{
  --stage:#efe3cc; --card:#fffaf0; --ink:#2a1d10; --muted:#6a5436; --line:#e3d1b0;
  --accent:#9c5416; --accent-ink:#ffffff; --soft:#f6ecd8; --good:#2f6f47; --warn:#a63a1b;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#140e09; --card:#211912; --ink:#f6ead6; --muted:#c7ae8a; --line:#3e2f1f;
  --accent:#e3a548; --accent-ink:#1d140b; --soft:#2b2117; --good:#79c99a; --warn:#ff9270; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#140e09; --card:#211912; --ink:#f6ead6; --muted:#c7ae8a; --line:#3e2f1f;
  --accent:#e3a548; --accent-ink:#1d140b; --soft:#2b2117; --good:#79c99a; --warn:#ff9270; color-scheme:dark}
body{background:var(--stage);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
[hidden]{display:none!important}
html.float,html.float body{background:transparent;padding:0;overflow:hidden}
.wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
html.float .wrap{display:block}
#setup{max-width:360px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
#setup h1{font:700 22px/1.1 var(--f-display);margin:0;text-wrap:balance}
#setup p{margin:0;color:var(--muted)}
.stage{position:relative;width:360px;height:640px;max-width:100%;flex:none}
html.float .stage{width:100vw;height:100vh;max-width:none}
canvas#c{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#lampHit{position:absolute;left:50%;bottom:8px;width:156px;height:236px;transform:translateX(-50%);cursor:grab;border-radius:40% 40% 12px 12px;touch-action:none}
#lampHit:active{cursor:grabbing}
#lampHit:focus-visible{outline:2px dashed var(--accent);outline-offset:2px}
#card{position:absolute;left:10px;right:10px;bottom:262px;max-height:calc(100% - 276px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;display:grid;gap:10px;box-shadow:0 10px 30px -12px rgba(60,30,0,.45);transform-origin:50% 100%;
  animation:pop .22s ease-out}
#card::after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
#say{margin:0;font:600 16px/1.3 var(--f-display);text-wrap:balance}
#card.brief>*:not(#say){display:none}
.now{display:grid;gap:6px;padding:10px;background:var(--soft);border-radius:10px;min-width:0}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ttl{font-weight:600;overflow-wrap:anywhere}
.ttl.priv{font-style:italic;color:var(--muted)}
.meta{color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button,.btn{font:500 13px/1 var(--f-body);border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;font:500 12px/1.4 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chips b{color:var(--ink);font-weight:500}
.chips .hot b{color:var(--warn)}
#cap{display:flex;gap:6px}
#cap input{flex:1;min-width:0;font:14px var(--f-body);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.foot small{color:var(--muted);font-size:11px}
.timer{font:500 22px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.err{color:var(--warn)}
@media (prefers-reduced-motion: reduce){#card{animation:none}}
</style>

<div class="wrap">
  <div id="setup" hidden>
    <h1 id="setupH">Vilakku lives on your desktop</h1>
    <p id="setupP">Install it from the Claude desktop app. The lamp then floats over your other windows, watches your Today list and cheers you on.</p>
    <div class="row"><button id="setupBtn" class="pri" hidden>Install as app</button></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div id="card" class="hit brief" hidden aria-live="polite">
      <p id="say">Lighting the wicks…</p>
      <div class="now" id="now"></div>
      <div class="chips" id="chips"></div>
      <form id="cap" hidden><input id="capIn" placeholder="Capture to Inbox…" maxlength="200" autocomplete="off" aria-label="Capture a task to your Inbox"><button type="button" id="mic" hidden aria-label="Speak the task">Mic</button><button class="pri" type="submit">Add</button></form>
      <div class="row">
        <button id="bFocus" type="button">Focus 25</button>
        <button id="bCap" type="button">Capture</button>
        <button id="bTalk" type="button">Say something</button>
        <a class="btn" href="https://task-hub-one-delta.vercel.app/" target="_blank" rel="noopener">Ambalam</a>
      </div>
      <div class="foot">
        <div class="row"><button id="bSound" type="button" aria-pressed="true">Bell</button><button id="bVoice" type="button" aria-pressed="false">Voice</button></div>
        <small id="upd"></small>
      </div>
    </div>
    <div id="lampHit" class="hit" role="button" tabindex="0" aria-label="Vilakku, the lamp. Click to open, drag to move."></div>
  </div>
</div>

<script>
(()=>{
"use strict";
const SERVER="Supabase Connector", APP_URL="https://task-hub-one-delta.vercel.app/";
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=localStorage.getItem("vilakku."+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("vilakku."+k,JSON.stringify(v))}catch{}}};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const q=s=>"'"+String(s).replace(/\u0000/g,"").replace(/'/g,"''")+"'";
const okId=id=>typeof id==="string"&&/^t-[0-9a-f-]{36}$/.test(id);
const ttl=t=>t?(t.private?"Private task":t.title):"";
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+"…":s;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hhmm=s=>s?String(s).slice(0,5):"";
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

/* ---------- state ---------- */
const st={data:null,err:null,queue:[],idx:0,lit:1,wick:[1,0,0,0,0],glow:.5,lean:0,flare:0,shiver:0,mood:"calm",
  focus:null,open:false,briefUntil:0,sound:ls.get("sound",true),voice:ls.get("voice",false),
  cursor:null,bounds:null,inApp:false,float:false,ignore:null,lastDone:Date.now(),busy:false,line:"",rub:[],petals:[],sparks:[]};
let desktop=null,mcp=null,ps={};

/* ---------- SQL ---------- */
const READ_SQL=`with d as (select (now() at time zone 'Asia/Kolkata')::date td),
pz as (select distinct unnest(project_tree(id)) pid from projects where paused_at is not null),
o as (select t.*, p.name pname from tasks t left join projects p on p.id=t.project_id
  where t.status in ('todo','doing','waiting') and coalesce(t.owner,'me')<>'agent' and t.superseded_by is null
  and (t.project_id is null or t.project_id not in (select pid from pz)))
select json_build_object(
 'today',(select td from d),
 'doing',(select coalesce(json_agg(x),'[]') from (select id,title,pname,status,private,resume_note,due,due_firm,due_time from o where status='doing' order by started_at desc nulls last limit 3) x),
 'list',(select coalesce(json_agg(x),'[]') from (select id,title,pname,status,priority,private,due,due_firm,due_time,quick,owed_to,highlight_day=(select td from d) star from o,d where status<>'waiting' and (today_date=td or due=td or (due_firm and due<td)) order by (highlight_day=td) desc nulls last,(due_firm and due<=td) desc nulls last, due_time nulls last, case priority when 'high' then 0 when 'med' then 1 else 2 end limit 12) x),
 'slip',(select coalesce(json_agg(x),'[]') from (select id,title,due,due_time,private from o,d where due_firm and due<=td order by due,due_time nulls last limit 5) x),
 'owed',(select coalesce(json_agg(x),'[]') from (select id,title,owed_to,created_at,private from o where owed_to is not null order by created_at limit 5) x),
 'quick',(select count(*) from o where quick),
 'inbox',(select count(*) from tasks where status='suggested' and coalesce(owner,'me')<>'agent'),
 'done_today',(select count(*) from tasks,d where status='done' and (done_at at time zone 'Asia/Kolkata')::date=td),
 'done_week',(select count(*) from tasks,d where status='done' and (done_at at time zone 'Asia/Kolkata')::date>=td-((extract(isodow from td)::int)-1))
) as pet;`;
const ACT="select set_config('app.actor','lamp',true);";
const DONE_SQL=id=>`${ACT}
with o as (select * from tasks where id = ${q(id)} and repeat is not null),
d as (
  update tasks set status = 'done', done_at = now(), repeat = null,
    activity = coalesce(activity,'[]'::jsonb) || jsonb_build_object('at',now(),'by','lamp','text','Done from the desk lamp; next one added')
  where id = (select id from o) returning id
),
n as (
  select o.*, (select min(x)::date from generate_series(coalesce(o.due,current_date)::timestamp, current_date + 400,
      case o.repeat when 'daily' then interval '1 day' when 'weekdays' then interval '1 day' when 'weekly' then interval '7 days'
                    when 'fortnightly' then interval '14 days' else interval '1 month' end) x
    where x::date > coalesce(o.due,current_date) and x::date >= (now() at time zone 'Asia/Kolkata')::date
      and (o.repeat <> 'weekdays' or extract(isodow from x) < 6)) as next_due
  from o join d using (id)
)
insert into tasks (title, project_id, priority, notes, steps, repeat, due, due_firm, due_time, owner, private, quick, effort_days, source, status, activity)
select title, project_id, priority, notes,
  coalesce((select jsonb_agg(jsonb_build_object('text', s->>'text', 'done', false)) from jsonb_array_elements(n.steps) s), '[]'::jsonb),
  repeat, next_due, due_firm, due_time, owner, private, quick, effort_days, 'hub', 'todo',
  jsonb_build_array(jsonb_build_object('at',now(),'by','lamp','text','Repeats; follows the one just done'))
from n
where not exists (select 1 from tasks x where x.title = n.title and x.project_id is not distinct from n.project_id
  and x.repeat = n.repeat and x.status in ('todo','doing','waiting') and x.id <> n.id);
update tasks set status = 'done', done_at = now(),
  activity = coalesce(activity,'[]'::jsonb) || jsonb_build_object('at',now(),'by','lamp','text','Done from the desk lamp')
where id = ${q(id)} and status <> 'done';`;
const START_SQL=id=>`${ACT} update tasks set status = 'doing', started_at = coalesce(case when status = 'doing' then started_at end, now()) where id = ${q(id)};`;
const CAP_SQL=t=>`${ACT} insert into tasks (title, status, source, source_chat, activity) values (${q(t)}, 'suggested', 'hub', 'Lamp capture',
  jsonb_build_array(jsonb_build_object('at',now(),'by','lamp','text','Captured from the desk lamp'))) returning id;`;

function parse(p){
  if(p&&typeof p==="object"&&!Array.isArray(p)&&p.pet)return p.pet;
  const s=typeof p==="string"?p:(p&&typeof p.result==="string"?p.result:JSON.stringify(p));
  const m=s.match(/<untrusted-data-[\w-]+>\s*([\s\S]*?)\s*<\/untrusted-data-[\w-]+>/);
  const arr=JSON.parse(m?m[1]:s);const row=Array.isArray(arr)?arr[0]:arr;
  return row&&row.pet?row.pet:row;
}
async function sql(query){
  if(!mcp)throw{code:"nomcp"};
  const r=await mcp.callTool(SERVER,"execute_sql",{query},{cache:false});
  return r.payload!==undefined?r.payload:r;
}

/* ---------- data ---------- */
async function refresh(){
  if(st.busy)return;st.busy=true;
  try{onData(parse(await sql(READ_SQL)))}
  catch(e){st.err=e;if(!st.data)say(errLine(e),true);paint()}
  finally{st.busy=false}
}
function errLine(e){
  switch(e&&e.code){
    case "nomcp":return "I can't reach your tasks from here. Open me in the Claude app.";
    case "server_not_connected":return "Add the Supabase Connector in claude.ai Settings, Connectors, and I'll find your tasks.";
    case "needs_reauth":return "Reconnect the Supabase Connector in claude.ai Settings, Connectors.";
    case "approval_required":case "not_in_manifest":return "I need your OK to read your tasks. Tap Connect.";
    case "selection_required":return "Pick which Supabase Connector to use when Claude asks.";
    case "server_unavailable":case "upstream_error":return "The database didn't answer. I'll try again in a minute.";
    case "tool_error":return "The database refused that. "+trunc(String(e.message||""),120);
    default:return "Something blocked me: "+trunc(String((e&&e.message)||e),120);
  }
}
function onData(pet){
  const prev=st.data;st.data=pet;st.err=null;
  const seen=new Set(),qu=[];
  for(const t of [...(pet.doing||[]),...(pet.list||[])])if(!seen.has(t.id)){seen.add(t.id);qu.push(t)}
  const cur=st.queue[st.idx];st.queue=qu;
  const k=cur?qu.findIndex(x=>x.id===cur.id):-1;st.idx=k>=0?k:0;
  if(prev&&pet.done_today>prev.done_today)celebrate(pet.done_today-prev.done_today,false);
  setLit(pet.done_today,!!prev);
  if(!prev)greet();
  mood();paint();sideUI();checkNudges();
}
const litFor=d=>1+(d>=3)+(d>=7)+(d>=12)+(d>=20);
function setLit(done,anim){const n=litFor(done);if(n>st.lit&&anim){chime(2);say(pick(["Another wick lit. Look at that glow.","A new wick for you. Kollaam!","Five wicks is a festival. Keep going."]))}
  st.lit=n;for(let i=0;i<5;i++)if(i>=n)st.wick[i]=0}
function mood(){
  const d=st.data,h=new Date().getHours();
  st.mood=st.focus?"focus":(d&&d.slip&&d.slip.length)?"worried":(h>=23||h<6)?"sleepy":(Date.now()-st.lastDone>2*36e5&&h>=9&&h<21&&st.queue.length)?"idle":"calm";
}

/* ---------- voice of the lamp ---------- */
function say(text,stay){st.line=text;$("#say").textContent=text;$("#card").hidden=false;
  if(!st.open){$("#card").classList.add("brief");clearTimeout(say.t);if(!stay)say.t=setTimeout(()=>{if(!st.open)$("#card").hidden=true},7000)}
  if(st.voice)speak(text);mouse()}
function greet(){
  const d=st.data,c=st.queue[0],h=new Date().getHours();
  const hi=h<12?"Good morning.":h<17?"Good afternoon.":"Good evening.";
  if(st.mood==="worried")return say(`${hi} “${trunc(ttl(d.slip[0]),60)}” can't slip today${d.slip[0].due_time?`, due ${hhmm(d.slip[0].due_time)}`:""}.`);
  if(!c)return say(`${hi} Today is clear. ${d.inbox?`${d.inbox} things wait in your Inbox.`:"Light something new?"}`);
  say(`${hi} ${d.done_today?`${d.done_today} done already. `:""}First up: “${trunc(ttl(c),70)}”.`);
}
function localLine(){
  const d=st.data;if(!d)return "Lighting the wicks…";const c=st.queue[st.idx];
  switch(st.mood){
    case "worried":{const s=d.slip[0];return `“${trunc(ttl(s),60)}” can't slip. ${s.due_time?`Due ${hhmm(s.due_time)}.`:"Due today."} I'm flickering until it's done.`}
    case "sleepy":return pick(["It's late. Close the day and rest. Naale kaanam.","Even lamps get trimmed at night. Wrap up?","The oil's low and so are you. Bed?"]);
    case "idle":return c?pick([`It's gone quiet. Two minutes on “${trunc(ttl(c),50)}”?`,`My flame's drooping. Feed it one small thing.`,`Start “${trunc(ttl(c),50)}” and I'll stand up straight again.`]):"Quiet hour. Anything in the Inbox worth five minutes?";
    case "focus":return `Focusing on “${trunc(st.focus.title,60)}”. I'll keep the flame still.`;
  }
  const o=(d.owed||[])[0],days=o?Math.floor((Date.now()-new Date(o.created_at))/864e5):0;
  const opts=[
    d.done_today?`${d.done_today} done today, ${d.done_week} this week. Adipoli!`:"Nothing done yet. One small win lights the first wick.",
    c?`Next small step: “${trunc(ttl(c),60)}”.`:"Today's list is empty. Pick one from the Inbox?",
    d.quick?`${d.quick} two-minute tasks are waiting. Knock one out?`:"One wick at a time.",
    o&&days>=5?`${o.owed_to} has waited ${days} days on “${trunc(ttl(o),50)}”.`:"Steady flame, steady day.",
  ];
  return pick(opts);
}
async function claudeLine(){
  const b=$("#bTalk");b.disabled=true;say("Thinking…",true);
  try{
    const sample=await claude.use("sample");if(!sample)throw 0;
    const d=st.data||{},pub=t=>t&&!t.private;
    const facts=[`Local time: ${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`,
      `Done today: ${d.done_today??"?"}; this week: ${d.done_week??"?"}`,
      st.queue[st.idx]&&pub(st.queue[st.idx])?`Working on: ${st.queue[st.idx].title}`:"",
      `Next up: ${st.queue.filter(pub).slice(0,3).map(t=>t.title).join(" | ")||"nothing on today"}`,
      (d.slip||[]).filter(pub).length?`Hard deadlines today: ${(d.slip||[]).filter(pub).map(t=>t.title+(t.due_time?" by "+hhmm(t.due_time):"")).join(" | ")}`:"",
      (d.owed||[]).filter(pub).length?`People waiting on him: ${(d.owed||[]).filter(pub).slice(0,3).map(t=>`${t.owed_to} (${Math.floor((Date.now()-new Date(t.created_at))/864e5)} days, ${t.title})`).join(" | ")}`:"",
      `Inbox items waiting: ${d.inbox??0}; two-minute tasks: ${d.quick??0}`].filter(Boolean).join("\n- ");
    const r=await sample(`You are Vilakku, a brass Kerala nilavilakku (oil lamp) that stands on Vimal's desk and keeps him going through the day. Write ONE line, at most 22 words, to motivate him right now. Warm, a little playful, and specific to the facts below. You may use at most one Malayalam word in Latin letters (for example adipoli, kollaam, naale kaanam). No emoji, no hashtags, no quotation marks around the line.\n\nFacts:\n- ${facts}\n\nReturn only the line.`,{modelTier:"quick",cache:false});
    say((r.text||"").trim().replace(/^["“]|["”]$/g,"")||localLine());st.flare=Math.max(st.flare,.5);
  }catch(e){say(localLine())}
  finally{b.disabled=false}
}
let ttsP=null;
async function speak(text){try{ttsP=ttsP||claude.use("tts");const t=await ttsP;if(t)t.speak(text.slice(0,2000),{voice:"rounded"}).catch(()=>{})}catch{}}

/* ---------- actions ---------- */
async function doneTask(t){
  if(!t||!okId(t.id))return;
  const d=st.data;st.queue=st.queue.filter(x=>x.id!==t.id);if(st.idx>=st.queue.length)st.idx=0;
  if(d){d.done_today++;d.done_week++;d.list=(d.list||[]).filter(x=>x.id!==t.id);d.doing=(d.doing||[]).filter(x=>x.id!==t.id);d.slip=(d.slip||[]).filter(x=>x.id!==t.id)}
  if(st.focus&&st.focus.id===t.id)stopFocus(false);
  celebrate(1,true);setLit(d?d.done_today:0,true);mood();paint();sideUI();
  try{await sql(DONE_SQL(t.id))}catch(e){say("Not sure that saved: "+errLine(e)+" Checking…",true)}
  setTimeout(refresh,800);
}
async function startTask(t){
  if(!t||!okId(t.id))return;t.status="doing";paint();
  say(pick([`Started “${trunc(ttl(t),60)}”. I've got the light.`,"Off you go. Flame's steady.","Started. One thing at a time."]));
  try{await sql(START_SQL(t.id))}catch(e){say("Not sure that saved: "+errLine(e),true)}
  setTimeout(refresh,800);
}
async function capture(text){
  text=text.trim().replace(/\s+/g," ");if(!text)return;
  $("#capIn").value="";
  try{await sql(CAP_SQL(text.slice(0,200)));if(st.data)st.data.inbox++;st.flare=Math.max(st.flare,.4);
    say(pick(["Caught it. It's waiting in your Inbox.","Into the Inbox. Back to what you were doing.","Saved to the Inbox. Forget it for now."]));paint()}
  catch(e){$("#capIn").value=text;say("That didn't save: "+errLine(e),true)}
}
function startFocus(){
  const c=st.queue[st.idx];
  st.focus={id:c?c.id:null,title:c?ttl(c):"whatever matters most",end:Date.now()+25*60e3};
  chime(1);mood();say(`25 minutes on “${trunc(st.focus.title,60)}”. I'll keep the flame still.`);paint();sideUI();
}
function stopFocus(ask){
  const f=st.focus;st.focus=null;mood();paint();sideUI();
  if(ask&&f){chime(3);notify(`Focus done: ${f.title}. Finished it?`);st.askDone=f.id;openCard();say("Focus done. Did you finish it?",true);paint()}
}

/* ---------- card ---------- */

  const heat=st.mood==="worried"?1:0,jit=(reduce?.3:1)*(st.mood==="focus"?.25:st.mood==="worried"?1.7:1)+st.shiver*3;

  const hg=cx.createRadialGradient(front.x,front.y-26,4,front.x,front.y-26,Math.max(10,70+150*st.glow));
  hg.addColorStop(0,`rgba(255,190,80,${.42*st.glow})`);hg.addColorStop(.45,`rgba(255,150,40,${.16*st.glow})`);hg.addColorStop(1,"rgba(255,140,30,0)");
  cx.fillStyle=hg;cx.fillRect(0,0,W,H);
  lamp(cx,LX,LY,s);
  // wicks: back ones first so the front flame sits on top
  const order=[3,4,1,2,0];
  for(const i of order){if(i>=st.lit)continue;st.wick[i]=Math.min(1,st.wick[i]+dt*1.2);const p=wickPos(i,LX,LY,s),k=p.k*st.wick[i];
    const fl=1+.07*jit*Math.sin(t*7.3+i*1.7)+.05*jit*Math.sin(t*13.1+i*3.1)+.04*jit*Math.sin(t*23.7+i);
    const droop=st.mood==="idle"?.78:st.mood==="sleepy"?.55:1;
    if(k<.03)continue;
    const h=Math.max(2,(30+34*st.glow)*k*Math.max(.4,fl)*droop),w=Math.max(1,(9+5*st.glow)*k);
    const sway=.06*jit*Math.sin(t*2.1+i)+(st.shiver?Math.sin(t*40)*.25*st.shiver:0)+(st.mood==="idle"?-.12:0);
    flame(cx,p.x,p.y,h,w,st.lean+sway,heat)}
  // sparks drift up from the front flame
  if(!reduce&&Math.random()<dt*(1+5*st.glow))st.sparks.push({x:0,y:0,vx:(Math.random()-.5)*.6,vy:-.6-Math.random()*1.2,life:1});
  cx.globalCompositeOperation="lighter";
  st.sparks=st.sparks.filter(p=>(p.life-=dt*(p.big?.7:.9))>0);
  for(const p of st.sparks){p.x+=p.vx;p.y+=p.vy;p.vy*=.985;cx.fillStyle=`rgba(255,${180+60*p.life|0},90,${p.life})`;cx.beginPath();cx.arc(front.x+p.x,front.y-40+p.y,(p.big?2.2:1.3)*p.life+.3,0,6.3);cx.fill()}
  cx.globalCompositeOperation="source-over";
  // jasmine and marigold petals after a Done
  st.petals=st.petals.filter(p=>p.y<H+20);
  for(const p of st.petals){p.y+=p.vy*60*dt;p.sw+=dt*2;p.x+=Math.sin(p.sw)*.6;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
    cx.fillStyle=p.jas?"#fffaf0":"#f29f05";cx.strokeStyle=p.jas?"rgba(140,120,80,.35)":"rgba(150,70,0,.4)";cx.lineWidth=.6;
    cx.beginPath();cx.ellipse(0,0,6*p.s,2.8*p.s,0,0,6.3);cx.fill();cx.stroke();cx.restore()}
  // sleepy: a few z's
  if(st.mood==="sleepy"){cx.fillStyle="rgba(200,170,120,.7)";cx.font="600 14px "+getComputedStyle(document.body).fontFamily;
    for(let i=0;i<3;i++){const ph=(t*.4+i/3)%1;cx.globalAlpha=1-ph;cx.fillText("z",front.x+22+ph*20,front.y-60-ph*50);}cx.globalAlpha=1}
  // focus: a thin ring that empties as the 25 minutes run
  if(st.focus){const f=Math.max(0,(st.focus.end-Date.now())/(25*60e3));cx.strokeStyle="rgba(255,190,90,.8)";cx.lineWidth=3;cx.lineCap="round";
    cx.beginPath();cx.arc(LX,LY-162-46,36,-Math.PI/2,-Math.PI/2+f*Math.PI*2);cx.stroke();
    if(f<=0)stopFocus(true)}
  requestAnimationFrame(frame);
}
