<title>Vilakku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["overlay", "shortcuts", "notifications", "menu-bar", "full-access"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a fixed 340x600 stage. The brass lamp stands at the bottom, its speech card floats above it.
   On the desktop the window is see-through and clicks pass through everything except the lamp and the card. */
:root{
  --stage:#efe3cc; --card:#fffaf0; --ink:#2a1d10; --muted:#6a5436; --line:#e3d1b0;
  --accent:#9c5416; --accent-ink:#ffffff; --soft:#f6ecd8; --good:#2f6f47; --warn:#a63a1b;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#140e09; --card:#211912; --ink:#f6ead6; --muted:#c7ae8a; --line:#3e2f1f;
  --accent:#e3a548; --accent-ink:#1d140b; --soft:#2b2117; --good:#79c99a; --warn:#ff9270; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#140e09; --card:#211912; --ink:#f6ead6; --muted:#c7ae8a; --line:#3e2f1f;
  --accent:#e3a548; --accent-ink:#1d140b; --soft:#2b2117; --good:#79c99a; --warn:#ff9270; color-scheme:dark}
body{background:var(--stage);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
[hidden]{display:none!important}
html.float,html.float body{background:transparent!important;padding:0;overflow:hidden}
/* a dark color-scheme inside a light window paints an opaque canvas, so the floating lamp never asks for one */
html.float,html.float:root{color-scheme:light!important}
.wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
html.float .wrap{display:block}
#setup{max-width:360px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
#setup h1{font:700 22px/1.1 var(--f-display);margin:0;text-wrap:balance}
#setup p{margin:0;color:var(--muted)}
.stage{position:relative;width:340px;height:600px;max-width:100%;flex:none}
html.float .stage{width:100vw;height:100vh;max-width:none}
canvas#c{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#lampHit{position:absolute;left:50%;bottom:10px;width:70px;height:104px;transform:translateX(-50%);cursor:grab;border-radius:40% 40% 12px 12px;touch-action:none}
#lampHit:active{cursor:grabbing}
#lampHit:focus-visible{outline:2px dashed var(--accent);outline-offset:2px}
#card{position:absolute;left:8px;right:8px;bottom:120px;max-height:calc(100% - 130px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;display:grid;gap:10px;box-shadow:0 10px 30px -12px rgba(60,30,0,.45);transform-origin:50% 100%;
  animation:pop .22s ease-out}
#card::after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
#say{margin:0;font:600 16px/1.3 var(--f-display);text-wrap:balance}
#card.brief>*:not(#say){display:none}
.now{display:grid;gap:6px;padding:10px;background:var(--soft);border-radius:10px;min-width:0}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ttl{font-weight:600;overflow-wrap:anywhere}
.ttl.priv{font-style:italic;color:var(--muted)}
.meta{color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button,.btn{font:500 13px/1 var(--f-body);border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
#snd button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;font:500 12px/1.4 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chips b{color:var(--ink);font-weight:500}
.chips .hot b{color:var(--warn)}
#cap{display:flex;gap:6px}
#cap input{flex:1;min-width:0;font:14px var(--f-body);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.foot small{color:var(--muted);font-size:11px}
.timer{font:500 22px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.err{color:var(--warn)}
#snd{display:grid;gap:8px;padding:10px;background:var(--soft);border-radius:10px}
#snd .modes{display:flex;flex-wrap:wrap;gap:6px}
#snd .hint{color:var(--muted);font-size:12px;margin:0}
#snd label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
#snd input[type=range]{flex:1;accent-color:var(--accent);min-height:24px}
@media (prefers-reduced-motion: reduce){#card{animation:none}}
</style>

<div class="wrap">
  <div id="setup" hidden>
    <h1 id="setupH">Vilakku lives on your desktop</h1>
    <p id="setupP">Install it from the Claude desktop app. The lamp then floats over your other windows, watches your Today list and cheers you on.</p>
    <div class="row"><button id="setupBtn" class="pri" hidden>Install as app</button></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div id="card" class="hit brief" hidden aria-live="polite">
      <p id="say">Lighting the wicks…</p>
      <div class="now" id="now"></div>
      <div class="chips" id="chips"></div>
      <form id="cap" hidden><input id="capIn" placeholder="Capture to Inbox…" maxlength="200" autocomplete="off" aria-label="Capture a task to your Inbox"><button type="button" id="mic" hidden aria-label="Speak the task">Mic</button><button class="pri" type="submit">Add</button></form>
      <div class="row">
        <button id="bFocus" type="button">Focus 25</button>
        <button id="bCap" type="button">Capture</button>
        <button id="bTalk" type="button">Say something</button>
        <button id="bSnd" type="button" aria-expanded="false" aria-controls="snd">Sound</button>
        <a class="btn" href="https://task-hub-one-delta.vercel.app/" target="_blank" rel="noopener">Ambalam</a>
      </div>
      <div id="snd" hidden>
        <div class="eyebrow">Soundscape</div>
        <div class="modes" role="radiogroup" aria-label="Soundscape">
          <button type="button" role="radio" data-m="off" aria-checked="true">Off</button>
          <button type="button" role="radio" data-m="heal" aria-checked="false">Heal</button>
          <button type="button" role="radio" data-m="focus" aria-checked="false">Focus</button>
          <button type="button" role="radio" data-m="uplift" aria-checked="false">Uplift</button>
          <button type="button" role="radio" data-m="rest" aria-checked="false">Rest</button>
        </div>
        <p class="hint" id="sndHint">A low tanpura drone with singing bowls, made live. Use headphones for the gentle beat.</p>
        <label>Volume <input type="range" id="sndVol" min="0" max="100" value="45" aria-label="Soundscape volume"></label>
      </div>
      <div class="foot">
        <div class="row"><button id="bSound" type="button" aria-pressed="true">Bell</button><button id="bVoice" type="button" aria-pressed="false">Voice</button><button id="bAwake" type="button" aria-pressed="false" title="When you're idle for a minute, nudge the mouse and tap Shift so you stay active (⌥⇧A)">Stay active</button></div>
        <small id="upd"></small>
      </div>
    </div>
    <div id="lampHit" class="hit" role="button" tabindex="0" aria-label="Vilakku, the lamp. Click to open, drag to move."></div>
  </div>
</div>

<script>
(()=>{
"use strict";
const SERVER="Supabase Connector", APP_URL="https://task-hub-one-delta.vercel.app/";
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=localStorage.getItem("vilakku."+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("vilakku."+k,JSON.stringify(v))}catch{}}};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const q=s=>"'"+String(s).replace(/\u0000/g,"").replace(/'/g,"''")+"'";
const okId=id=>typeof id==="string"&&/^t-[0-9a-f-]{36}$/.test(id);
const ttl=t=>t?(t.private?"Private task":t.title):"";
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+"…":s;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hhmm=s=>s?String(s).slice(0,5):"";
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

/* ---------- state ---------- */
const st={data:null,err:null,queue:[],idx:0,lit:1,wick:[1,0,0,0,0],glow:.5,lean:0,flare:0,shiver:0,mood:"calm",
  focus:null,open:false,briefUntil:0,sound:ls.get("sound",true),voice:ls.get("voice",false),
  cursor:null,bounds:null,inApp:false,float:false,ignore:null,lastDone:Date.now(),busy:false,line:"",rub:[],petals:[],sparks:[],events:[],calOff:false,awake:false,awakeN:0,awakeMsg:"",festival:new Date().getDay()===5};
let desktop=null,mcp=null,ps={};

/* ---------- SQL ---------- */
const READ_SQL=`with d as (select (now() at time zone 'Asia/Kolkata')::date td),
pz as (select distinct unnest(project_tree(id)) pid from projects where paused_at is not null),
o as (select t.*, p.name pname from tasks t left join projects p on p.id=t.project_id
  where t.status in ('todo','doing','waiting') and coalesce(t.owner,'me')<>'agent' and t.superseded_by is null
  and (t.project_id is null or t.project_id not in (select pid from pz)))
select json_build_object(
 'today',(select td from d),
 'doing',(select coalesce(json_agg(x),'[]') from (select id,title,pname,status,private,resume_note,due,due_firm,due_time from o where status='doing' order by started_at desc nulls last limit 3) x),
 'list',(select coalesce(json_agg(x),'[]') from (select id,title,pname,status,priority,private,due,due_firm,due_time,quick,owed_to,highlight_day=(select td from d) star from o,d where status<>'waiting' and (today_date=td or due=td or (due_firm and due<td)) order by (highlight_day=td) desc nulls last,(due_firm and due<=td) desc nulls last, due_time nulls last, case priority when 'high' then 0 when 'med' then 1 else 2 end limit 12) x),
 'slip',(select coalesce(json_agg(x),'[]') from (select id,title,due,due_time,private from o,d where due_firm and due<=td order by due,due_time nulls last limit 5) x),
 'owed',(select coalesce(json_agg(x),'[]') from (select id,title,owed_to,created_at,private from o where owed_to is not null order by created_at limit 5) x),
 'quick',(select count(*) from o where quick),
 'inbox',(select count(*) from tasks where status='suggested' and coalesce(owner,'me')<>'agent'),
 'done_today',(select count(*) from tasks,d where status='done' and (done_at at time zone 'Asia/Kolkata')::date=td),
 'streak',(with dd as (select distinct (done_at at time zone 'Asia/Kolkata')::date dy from tasks where status='done' and done_at > now()-interval '400 days'),
   s as (select dy, dy - (row_number() over (order by dy))::int g from dd)
   select case when max(dy) >= (select td from d)-1 then (select count(*) from s s2 where s2.g=(select g from s where dy=(select max(dy) from dd))) else 0 end from dd),
 'done_week',(select count(*) from tasks,d where status='done' and (done_at at time zone 'Asia/Kolkata')::date>=td-((extract(isodow from td)::int)-1))
) as pet;`;
const ACT="select set_config('app.actor','lamp',true);";
const DONE_SQL=id=>`${ACT}
with o as (select * from tasks where id = ${q(id)} and repeat is not null),
d as (
  update tasks set status = 'done', done_at = now(), repeat = null,
    activity = coalesce(activity,'[]'::jsonb) || jsonb_build_object('at',now(),'by','lamp','text','Done from the desk lamp; next one added')
  where id = (select id from o) returning id
),
n as (
  select o.*, (select min(x)::date from generate_series(coalesce(o.due,current_date)::timestamp, current_date + 400,
      case o.repeat when 'daily' then interval '1 day' when 'weekdays' then interval '1 day' when 'weekly' then interval '7 days'
                    when 'fortnightly' then interval '14 days' else interval '1 month' end) x
    where x::date > coalesce(o.due,current_date) and x::date >= (now() at time zone 'Asia/Kolkata')::date
      and (o.repeat <> 'weekdays' or extract(isodow from x) < 6)) as next_due
  from o join d using (id)
)
insert into tasks (title, project_id, priority, notes, steps, repeat, due, due_firm, due_time, owner, private, quick, effort_days, source, status, activity)
select title, project_id, priority, notes,
  coalesce((select jsonb_agg(jsonb_build_object('text', s->>'text', 'done', false)) from jsonb_array_elements(n.steps) s), '[]'::jsonb),
  repeat, next_due, due_firm, due_time, owner, private, quick, effort_days, 'hub', 'todo',
  jsonb_build_array(jsonb_build_object('at',now(),'by','lamp','text','Repeats; follows the one just done'))
from n
where not exists (select 1 from tasks x where x.title = n.title and x.project_id is not distinct from n.project_id
  and x.repeat = n.repeat and x.status in ('todo','doing','waiting') and x.id <> n.id);
update tasks set status = 'done', done_at = now(),
  activity = coalesce(activity,'[]'::jsonb) || jsonb_build_object('at',now(),'by','lamp','text','Done from the desk lamp')
where id = ${q(id)} and status <> 'done';`;
const START_SQL=id=>`${ACT} update tasks set status = 'doing', started_at = coalesce(case when status = 'doing' then started_at end, now()) where id = ${q(id)};`;
const CAP_SQL=t=>`${ACT} insert into tasks (title, status, source, source_chat, activity) values (${q(t)}, 'suggested', 'hub', 'Lamp capture',
  jsonb_build_array(jsonb_build_object('at',now(),'by','lamp','text','Captured from the desk lamp'))) returning id;`;

function parse(p){
  if(p&&typeof p==="object"&&!Array.isArray(p)&&p.pet)return p.pet;
  const s=typeof p==="string"?p:(p&&typeof p.result==="string"?p.result:JSON.stringify(p));
  const m=s.match(/<untrusted-data-([\w-]+)>\s*(\[[\s\S]*\]|\{[\s\S]*\})\s*<\/untrusted-data-\1>/);
  const arr=JSON.parse(m?m[2]:s);const row=Array.isArray(arr)?arr[0]:arr;
  return row&&row.pet?row.pet:row;
}
async function sql(query){
  if(!mcp)throw{code:"nomcp"};
  const r=await mcp.callTool(SERVER,"execute_sql",{query},{cache:false});
  return r.payload!==undefined?r.payload:r;
}

/* ---------- data ---------- */
async function refresh(){
  if(st.busy)return;st.busy=true;
  try{onData(parse(await sql(READ_SQL)))}
  catch(e){st.err=e;if(!st.data)say(errLine(e),true);paint()}
  finally{st.busy=false}
}
function errLine(e){
  switch(e&&e.code){
    case "nomcp":return "I can't reach your tasks from here. Open me in the Claude app.";
    case "server_not_connected":return "Add the Supabase Connector in claude.ai Settings, Connectors, and I'll find your tasks.";
    case "needs_reauth":return "Reconnect the Supabase Connector in claude.ai Settings, Connectors.";
    case "approval_required":case "not_in_manifest":return "I need your OK to read your tasks. Tap Connect.";
    case "selection_required":return "Pick which Supabase Connector to use when Claude asks.";
    case "server_unavailable":case "upstream_error":return "The database didn't answer. I'll try again in a minute.";
    case "tool_error":return "The database refused that. "+trunc(String(e.message||""),120);
    default:return "Something blocked me: "+trunc(String((e&&e.message)||e),120);
  }
}
function onData(pet){
  const prev=st.data;st.data=pet;st.err=null;
  const seen=new Set(),qu=[];
  for(const t of [...(pet.doing||[]),...(pet.list||[])])if(!seen.has(t.id)){seen.add(t.id);qu.push(t)}
  const cur=st.queue[st.idx];st.queue=qu;
  const k=cur?qu.findIndex(x=>x.id===cur.id):-1;st.idx=k>=0?k:0;
  if(prev&&pet.done_today>prev.done_today)celebrate(pet.done_today-prev.done_today,false);
  setLit(pet.done_today,!!prev);
  if(!prev)greet();
  mood();paint();sideUI();checkNudges();
}
const litFor=d=>st.festival?5:1+(d>=3)+(d>=7)+(d>=12)+(d>=20);
function setLit(done,anim){const n=litFor(done);if(n>st.lit&&anim){chime(2);say(pick(["Another wick lit. Look at that glow.","A new wick for you. Kollaam!","Five wicks is a festival. Keep going."]))}
  st.lit=n;for(let i=0;i<5;i++)if(i>=n)st.wick[i]=0}
function mood(){
  const d=st.data,h=new Date().getHours();
  st.festival=new Date().getDay()===5;
  st.mood=st.focus?"focus":meeting()?"meeting":(d&&d.slip&&d.slip.length)?"worried":(h>=23||h<6)?"sleepy":(Date.now()-st.lastDone>2*36e5&&h>=9&&h<21&&st.queue.length)?"idle":"calm";
}

/* ---------- voice of the lamp ---------- */
function say(text,stay){st.line=text;if(st.callHidden)return;$("#say").textContent=text;$("#card").hidden=false;
  if(!st.open){$("#card").classList.add("brief");clearTimeout(say.t);if(!stay)say.t=setTimeout(()=>{if(!st.open)$("#card").hidden=true},7000)}
  if(st.voice)speak(text);mouse()}
function greet(){
  const d=st.data,c=st.queue[0],h=new Date().getHours();
  let hi=h<12?"Good morning.":h<17?"Good afternoon.":"Good evening.";if(st.festival)hi+=" It's Friday, so all five wicks are lit.";
  if(st.mood==="worried")return say(`${hi} “${trunc(ttl(d.slip[0]),60)}” can't slip today${d.slip[0].due_time?`, due ${hhmm(d.slip[0].due_time)}`:""}.`);
  if(!c)return say(`${hi} Today is clear. ${d.inbox?`${d.inbox} things wait in your Inbox.`:"Light something new?"}`);
  say(`${hi} ${d.done_today?`${d.done_today} done already. `:""}First up: “${trunc(ttl(c),70)}”.`);
}
function localLine(){
  const d=st.data;if(!d)return "Lighting the wicks…";const c=st.queue[st.idx];
  switch(st.mood){
    case "worried":{const s=d.slip[0];return `“${trunc(ttl(s),60)}” can't slip. ${s.due_time?`Due ${hhmm(s.due_time)}.`:"Due today."} I'm flickering until it's done.`}
    case "sleepy":return pick(["It's late. Close the day and rest. Naale kaanam.","Even lamps get trimmed at night. Wrap up?","The oil's low and so are you. Bed?"]);
    case "idle":return c?pick([`It's gone quiet. Two minutes on “${trunc(ttl(c),50)}”?`,`My flame's drooping. Feed it one small thing.`,`Start “${trunc(ttl(c),50)}” and I'll stand up straight again.`]):"Quiet hour. Anything in the Inbox worth five minutes?";
    case "meeting":{const m=meeting(),k=Math.round((m.start-Date.now())/6e4);return k>0?`“${trunc(m.title,50)}” in ${k} min. I've dimmed so you can wrap up.`:`“${trunc(m.title,50)}” is on. I'll keep quiet.`}
    case "focus":return `Focusing on “${trunc(st.focus.title,60)}”. I'll keep the flame still.`;
  }
  const o=(d.owed||[])[0],days=o?Math.floor((Date.now()-new Date(o.created_at))/864e5):0;
  const opts=[
    d.done_today?`${d.done_today} done today, ${d.done_week} this week. Adipoli!`:"Nothing done yet. One small win lights the first wick.",
    c?`Next small step: “${trunc(ttl(c),60)}”.`:"Today's list is empty. Pick one from the Inbox?",
    d.quick?`${d.quick} two-minute tasks are waiting. Knock one out?`:"One wick at a time.",
    d.streak>=2?`${d.streak} days in a row with something done. Don't break the chain.`:"Steady flame, steady day.",
    o&&days>=5?`${o.owed_to} has waited ${days} days on “${trunc(ttl(o),50)}”.`:"Steady flame, steady day.",
  ];
  return pick(opts);
}
async function claudeLine(){
  const b=$("#bTalk");b.disabled=true;say("Thinking…",true);
  try{
    const sample=await claude.use("sample");if(!sample)throw 0;
    const d=st.data||{},pub=t=>t&&!t.private;
    const facts=[`Local time: ${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`,
      `Done today: ${d.done_today??"?"}; this week: ${d.done_week??"?"}`,
      st.queue[st.idx]&&pub(st.queue[st.idx])?`Working on: ${st.queue[st.idx].title}`:"",
      `Next up: ${st.queue.filter(pub).slice(0,3).map(t=>t.title).join(" | ")||"nothing on today"}`,
      (d.slip||[]).filter(pub).length?`Hard deadlines today: ${(d.slip||[]).filter(pub).map(t=>t.title+(t.due_time?" by "+hhmm(t.due_time):"")).join(" | ")}`:"",
      (d.owed||[]).filter(pub).length?`People waiting on him: ${(d.owed||[]).filter(pub).slice(0,3).map(t=>`${t.owed_to} (${Math.floor((Date.now()-new Date(t.created_at))/864e5)} days, ${t.title})`).join(" | ")}`:"",
      `Inbox items waiting: ${d.inbox??0}; two-minute tasks: ${d.quick??0}`].filter(Boolean).join("\n- ");
    const r=await sample(`You are Vilakku, a brass Kerala nilavilakku (oil lamp) that stands on Vimal's desk and keeps him going through the day. Write ONE line, at most 22 words, to motivate him right now. Warm, a little playful, and specific to the facts below. You may use at most one Malayalam word in Latin letters (for example adipoli, kollaam, naale kaanam). No emoji, no hashtags, no quotation marks around the line.\n\nFacts:\n- ${facts}\n\nReturn only the line.`,{modelTier:"quick",cache:false});

function startFocus(){

/* ---------- stay active: simulated mouse and keystrokes (macOS) ----------
   Every 20 s, read how long the Mac has had no real input (HIDIdleTime). Once it passes IDLE_S, nudge the
   cursor a few pixels and back and tap Shift, posted as real HID events, so idle timers and "away" statuses reset.
   It never acts while you're using the machine. Needs full access (to run osascript) and, once, the
   Claude app in System Settings > Privacy & Security > Accessibility (macOS drops posted events otherwise). */
const IDLE_S=60,AWAKE_MS=20e3;
const JXA_NUDGE=`ObjC.import("CoreGraphics");var p=$.CGEventGetLocation($.CGEventCreate(null));`+
  `var dx=3+Math.floor(Math.random()*6),dy=3+Math.floor(Math.random()*6);`+
  `function mv(x,y){$.CGEventPost(0,$.CGEventCreateMouseEvent(null,5,{x:x,y:y},0))}`+
  `mv(p.x+dx,p.y+dy);delay(0.08);mv(p.x,p.y);`+
  `function k(d){$.CGEventPost(0,$.CGEventCreateKeyboardEvent(null,56,d))}k(true);delay(0.03);k(false);"ok"`;
const JXA_TRUST=prompt=>`ObjC.import("ApplicationServices");`+(prompt?`$.AXIsProcessTrustedWithOptions($({AXTrustedCheckOptionPrompt:true}))`:`$.AXIsProcessTrusted()`);
const sh1=s=>"'"+s.replace(/'/g,"'\\''")+"'";
const AWAKE_CMD=`i=$(ioreg -c IOHIDSystem | awk '/HIDIdleTime/ {print int($NF/1000000000); exit}'); echo "idle=$i"; `+
  `if [ "\${i:-0}" -ge ${IDLE_S} ]; then /usr/bin/osascript -l JavaScript -e ${sh1(JXA_NUDGE)}; fi`;
let awakeT=null;
async function awakeToggle(){if(st.awake)awakeOff();else awakeOn(true)}
async function awakeOn(fromClick){
  if(!desktop||!desktop.childProcess){say("Stay active works only in the installed lamp.",true);return}
  const os=await desktop.os.platform().catch(()=>"");
  if(os!=="darwin"){say("Stay active is Mac-only for now.",true);return}
  try{
    const r=await desktop.childProcess.exec(`/usr/bin/osascript -l JavaScript -e ${sh1(JXA_TRUST(fromClick))}`,{timeout:15000});
    if(String(r.stdout).trim()!=="true"){awakeHelp();return}
  }catch(e){say(String(e.message||"").startsWith("EPERM")?"Stay active needs full access, so I can run a small script. Allow it when I ask (try again).":"I couldn't start Stay active: "+trunc(String(e.message||e),120),true);return}
  st.awake=true;ls.set("awake",true);clearInterval(awakeT);awakeT=setInterval(awakeTick,AWAKE_MS);awakeTick();
  if(fromClick)say("Staying active. After a minute idle I'll nudge the mouse and tap Shift. ⌥⇧A to stop.");
  paint();sideUI();
}
function awakeOff(){st.awake=false;ls.set("awake",false);clearInterval(awakeT);awakeT=null;say("Stay active is off. I'll let your Mac rest.");paint();sideUI()}
function awakeHelp(){
  openCard();say("One more step: turn on Claude in System Settings, Privacy & Security, Accessibility. Then press Stay active again.",true);
  desktop.childProcess.exec(`open "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility"`,{timeout:8000}).catch(()=>{});
}
async function awakeTick(){
  if(!st.awake)return;
  try{const r=await desktop.childProcess.exec(AWAKE_CMD,{timeout:10000});
    if(/\bok\b/.test(r.stdout)){st.awakeN++;if(st.open)paint()}
    else if(r.code&&r.stderr){st.awakeMsg=trunc(r.stderr.trim(),120)}}
  catch(e){if(String(e.message||"").startsWith("EPERM")){clearInterval(awakeT);st.awake=false;paint();sideUI();say("Stay active stopped: full access was turned off.",true)}}
}

/* ---------- calls: get off the screen ----------
   From one minute before a calendar meeting until it ends, the lamp hides its window and stays silent
   (no lines, no voice, no notifications), so it never shows up in a screen share. It comes back when the call ends.
   If you bring it back yourself during a call (menu bar, ⌥⇧L), it stays for the rest of that call. */
const inCallNow=()=>{const n=Date.now();return (st.events||[]).find(e=>e.start-n<=60e3&&e.end>n)||null};
let callSeen=new Set();
function callGuard(){
  if(!st.inApp)return;const c=inCallNow();
  if(c&&!callSeen.has(c.id)){callSeen.add(c.id);st.callHidden=c.id;closeCard();droneDuck(true);desktop.window.hide().catch(()=>{})}
  else if(!c&&st.callHidden){st.callHidden=null;droneDuck(false);lastGreet=Date.now()-8*60e3;desktop.window.show().catch(()=>{});setTimeout(()=>say(pick(["Call's done. Welcome back.","Back on the desk. What's next?","That's the call. One small thing now?"])),800)}
}
function showDuringCall(){if(st.callHidden)st.callHidden=null}

/* ---------- opening the laptop: a bell and a good word ----------
   A heartbeat every 5 s; a gap of over 150 s means the Mac slept, so the lid just opened (or it woke).
   Also once when the lamp starts, and at a few random times through the day (9:00 to 21:00). */
let beat=Date.now();
function wakeWatch(){const n=Date.now(),gap=n-beat;beat=n;if(gap>150e3)setTimeout(()=>greetWake("wake"),2500)}
const AFFIRM=["You've done hard things before. This is one more.","Small steps, lit one by one, make a bright day.","You don't have to do it all. Just the next thing, well.",
  "Your work matters, and so does the person doing it.","Progress, not perfection. Light one wick.","You are building something real. Keep going.",

/* ---------- sound: one audio graph ----------
   master -> compressor -> speakers, with a send into a generated room reverb. The bell and the soundscapes share it. */
let ac=null,AU=null;
function unlockAudio(){try{if(!ac){ac=new AudioContext();buildAudio()}if(ac.state==="suspended")ac.resume()}catch{}}
function buildAudio(){
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.connect(ac.destination);
  const master=ac.createGain();master.gain.value=.9;master.connect(comp);
  const rev=ac.createConvolver(),len=ac.sampleRate*3.2,ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}

  const noise=ac.createBuffer(1,ac.sampleRate*6,ac.sampleRate),nd=noise.getChannelData(0);let lastN=0; // brown noise
  for(let i=0;i<nd.length;i++){lastN=(lastN+.02*(Math.random()*2-1))/1.02;nd[i]=lastN*3.5}

const out=(node,send=.5)=>{node.connect(AU.master);if(send){const g=ac.createGain();g.gain.value=send;node.connect(g).connect(AU.rev)}};

/* A brass temple bell (mani): a low hum, a strike, then inharmonic partials, each a slightly detuned pair
   so the ring wobbles, the lower ones ringing longest. */
const BELL=[[.5,.32,7],[1,1,5.5],[1.19,.45,4.2],[1.5,.3,3.6],[2,.55,3.2],[2.51,.22,2.3],[2.99,.18,1.8],[4.17,.12,1.2],[5.43,.08,.8],[6.8,.05,.5]];
function bell(t0,base,vol=.22){
  for(const [r,g,dec] of BELL){for(const det of [-1,1]){const o=ac.createOscillator(),v=ac.createGain();
    o.frequency.value=base*r+det*(.35+r*.25);v.gain.setValueAtTime(0,t0);v.gain.linearRampToValueAtTime(g*vol*.5,t0+.004);
    v.gain.exponentialRampToValueAtTime(1e-4,t0+dec);o.connect(v);out(v,.45);o.start(t0);o.stop(t0+dec+.1)}}
  const n=ac.createBufferSource(),bp=ac.createBiquadFilter(),v=ac.createGain();n.buffer=AU.noise;bp.type="bandpass";bp.frequency.value=base*4;bp.Q.value=1.2;
  v.gain.setValueAtTime(vol*.9,t0);v.gain.exponentialRampToValueAtTime(1e-4,t0+.06);n.connect(bp).connect(v);out(v,.3);n.start(t0,Math.random()*4);n.stop(t0+.08);
}
function chime(n=1){if(!st.sound)return;unlockAudio();if(!ac)return;for(let k=0;k<n;k++)bell(ac.currentTime+.02+k*.9,k%2?587:523)}

/* ---------- soundscapes ----------
   Each is a plucked tanpura drone (Pa, Sa, Sa, low Sa, round and round), a soft pad, a binaural beat
   (left and right a few Hz apart, felt in headphones), and optionally brown noise and singing bowls.
   These are relaxing sounds; the beat frequencies follow common practice, not proven effects. */
const MODES={
  off:{label:"Off"},
  heal:{label:"Heal",sa:136.1,cut:900,pluck:1.5,beat:6,noise:0,bowl:[16,28],pad:.5,hint:"Om tone (136 Hz) drone, singing bowls, a slow 6 Hz beat. Unhurried."},
  focus:{label:"Focus",sa:110,cut:650,pluck:1.9,beat:14,noise:.5,bowl:null,pad:.35,hint:"Brown noise to mask the room, a quiet low drone, a 14 Hz beat. Nothing to listen to, on purpose."},
  uplift:{label:"Uplift",sa:196,cut:1700,pluck:1.1,beat:18,noise:0,bowl:[40,70],pad:.45,hint:"Brighter tanpura in G, a little quicker, a 18 Hz beat. For getting going."},
  rest:{label:"Rest",sa:98,cut:480,pluck:2.6,beat:3,noise:.35,bowl:[35,60],pad:.6,hint:"Very low drone, ocean-like swells, a slow 3 Hz beat. For winding down."}};
const TAN=[.75,1,1,.5];
st.drone="off";let D=null,droneVol=ls.get("sndVol",45)/100;
function droneSet(m){
  if(m!=="off")unlockAudio();if(!ac&&m!=="off")return;
  droneStop();st.drone=m;if(m!=="off")droneStart(MODES[m]);
  for(const b of document.querySelectorAll("#snd [data-m]"))b.setAttribute("aria-checked",b.dataset.m===m);
  $("#sndHint").textContent=MODES[m].hint||"A low tanpura drone with singing bowls, made live. Use headphones for the gentle beat.";
  $("#bSnd").textContent=m==="off"?"Sound":"Sound: "+MODES[m].label;sideUI();
}
function droneStart(M){
  const t=ac.currentTime,bus=ac.createGain();bus.gain.setValueAtTime(0,t);bus.gain.linearRampToValueAtTime(droneVol*.55,t+4);out(bus,.55);
  const nodes=[];const keep=n=>(nodes.push(n),n);
  // pad: two soft sines on Sa, an octave apart
  for(const [r,g] of [[.5,.35],[1,.25]]){const o=keep(ac.createOscillator()),v=ac.createGain();o.frequency.value=M.sa*r;v.gain.value=g*M.pad*.25;o.connect(v).connect(bus);o.start()}
  // binaural beat around low Sa

  [0,M.beat].forEach((d,ch)=>{const o=keep(ac.createOscillator());o.frequency.value=M.sa*.5+d;o.connect(mer,0,ch);o.start()});

    n.connect(lp).connect(v).connect(bus);n.start()}

  D.iv=setInterval(droneTick,500);droneTick();
}
function pluck(t,f,M){ // a tanpura string: buzzy saw through a closing lowpass, long ring
  const o=ac.createOscillator(),o2=ac.createOscillator(),lp=ac.createBiquadFilter(),v=ac.createGain();o.type="sawtooth";o2.type="sawtooth";o.frequency.value=f;o2.frequency.value=f*1.003;

function bowl(t,f){ // a singing bowl: few partials, beating pairs, very long ring
  for(const [r,g,dec] of [[1,1,14],[2.71,.4,9],[5.15,.15,5],[8.4,.06,3]])for(const det of [-1,1]){const o=ac.createOscillator(),v=ac.createGain();
    o.frequency.value=f*r+det*.6*r;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.07*g,t+.02);v.gain.exponentialRampToValueAtTime(1e-4,t+dec);

function droneTick(){

const cv=$("#c"),cx=cv.getContext("2d");let W=340,H=600,S=.3,DPR=1,stageRect={left:0,top:0},bodyC=null,litC=null;
function size(){const r=$("#stage").getBoundingClientRect();stageRect=r;W=r.width;H=r.height;DPR=devicePixelRatio||1;cv.width=W*DPR;cv.height=H*DPR;bodyC=null}

/* The lamp is turned brass, so it is drawn like a lathe: a profile of [y, radius] pairs, in lamp units
   (y runs up from the foot at 0 to the spire tip at -290). Rows are shaded as a polished cylinder, shelves get elliptical caps. */
const FOOT=[[0,72],[-3,75],[-7,74],[-9,68],[-12,66],[-15,68],[-17,65],[-24,56],[-31,46],[-37,38],[-41,34],[-43,36],[-46,34],[-50,26],[-54,19],[-56,21],[-59,18],[-62,11]];
const STEM=[[-62,9],[-78,8],[-81,12],[-83,15],[-85,12],[-88,8],[-104,7],[-107,11],[-109,16],[-111,11],[-114,7],[-132,7],[-135,11],[-137,7],[-150,6],[-154,9],[-158,15],[-161,20],[-163,24]];
const SPIRE=[[-190,6],[-204,5],[-207,10],[-210,5],[-226,4],[-229,8],[-232,4],[-240,5],[-247,10],[-254,11],[-262,10],[-270,7],[-278,4],[-286,1]];
const BY=-190,BR=80,SQ=.2;
const WICKS=[90,162,18,234,306]; // the five lobe tips, in lighting order: front, left, right, back-left, back-right
const lobeR=a=>BR*(1+.13*Math.pow(Math.max(0,Math.cos(5*(a-Math.PI/2))),6));
function rowG(c,r){const g=c.createLinearGradient(-r,0,r,0);
  g.addColorStop(0,"#3a2306");g.addColorStop(.1,"#77490f");g.addColorStop(.28,"#dcae52");g.addColorStop(.36,"#fff0c2");g.addColorStop(.44,"#e6ad48");

function capG(c,r,y){const g=c.createLinearGradient(-r,y-r*SQ,r*.6,y+r*SQ);g.addColorStop(0,"#fff3cf");g.addColorStop(.4,"#e3b35a");g.addColorStop(1,"#8a571a");return g}
function lathe(c,P){
  for(let i=0;i<P.length-1;i++){const [y0,r0]=P[i],[y1,r1]=P[i+1];
    for(let y=y0;y>=y1;y-=.6){const r=r0+(r1-r0)*((y0-y)/((y0-y1)||1));c.fillStyle=rowG(c,r);c.fillRect(-r,y-1,2*r,1.4)}}
  for(let i=1;i<P.length-1;i++){const [y,r]=P[i];if(r>P[i+1][1]+1&&r>=P[i-1][1]){c.fillStyle=capG(c,r,y);c.beginPath();c.ellipse(0,y,r,r*SQ*.85,0,0,Math.PI*2);c.fill();

}

  c.fillStyle=rowG(c,72);c.beginPath();c.ellipse(0,0,72,13,0,0,Math.PI);c.fill();
  lathe(c,FOOT);lathe(c,STEM);
  for(let y=-163;y>=BY;y-=.6){const t=(-163-y)/(-163-BY),r=24+(BR-24)*Math.sin(t*Math.PI/2);c.fillStyle=rowG(c,r);c.fillRect(-r,y-1,2*r,1.4)}

  c.strokeStyle="rgba(60,30,0,.45)";c.lineWidth=.8;c.stroke();

  lobe(c,.86,2);const og=c.createRadialGradient(-14,BY-2,2,0,BY+2,70);og.addColorStop(0,"#e3a238");og.addColorStop(.55,"#9a5f14");og.addColorStop(1,"#4c2c06");c.fillStyle=og;c.fill();

}
function wickXY(i){const a=WICKS[i]*Math.PI/180,r=lobeR(a)*.97;return{x:Math.cos(a)*r,y:BY+Math.sin(a)*r*SQ-1,k:Math.sin(a)<0?.74:i===0?1:.9,a}}

  const g=bodyC.getContext("2d");g.setTransform(DPR,0,0,DPR,0,0);g.translate(W/2,H-18);g.scale(S,S);drawBody(g)}
function flame(c,x,y,h,w,lean,heat,t,i){

  g.addColorStop(0,"rgba(255,250,228,1)");g.addColorStop(.28,heat?"rgba(255,160,60,.97)":"rgba(255,208,96,.97)");g.addColorStop(.62,heat?"rgba(226,64,22,.85)":"rgba(246,128,30,.86)");g.addColorStop(1,"rgba(200,60,10,0)");

function garland(c,t){ // Friday: marigold and jasmine strung between the side lobes

}
let t0=performance.now(),last=t0;
function frame(now){
  const t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;ensureBody();
  cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
  const LX=W/2,LY=H-18,f0=wickXY(0),front={x:LX+f0.x*S,y:LY+f0.y*S};

  st.glow+=((base+(st.festival?.15:0)+.6*prox+.5*st.flare)-st.glow)*Math.min(1,dt*4);
  st.lean+=(lt-st.lean)*Math.min(1,dt*5);st.flare=Math.max(0,st.flare-dt*.5);st.shiver=Math.max(0,st.shiver-dt*.7);
  const heat=st.mood==="worried"?1:0,jit=(reduce?.3:1)*(st.mood==="focus"||st.mood==="meeting"?.25:st.mood==="worried"?1.7:1)+st.shiver*3;
  const hg=cx.createRadialGradient(front.x,front.y-26,4,front.x,front.y-26,Math.max(10,(70+150*st.glow)*.55));
  hg.addColorStop(0,`rgba(255,190,80,${.42*st.glow})`);hg.addColorStop(.45,`rgba(255,150,40,${.16*st.glow})`);hg.addColorStop(1,"rgba(255,140,30,0)");
  cx.fillStyle=hg;cx.fillRect(0,0,W,H);
  // the brass, lit by its own flames
  const lc=litC.getContext("2d");lc.setTransform(1,0,0,1,0,0);lc.globalCompositeOperation="source-over";lc.clearRect(0,0,litC.width,litC.height);lc.drawImage(bodyC,0,0);
  lc.setTransform(DPR,0,0,DPR,0,0);lc.globalCompositeOperation="source-atop";

    g.addColorStop(0,`rgba(255,200,110,${.5*st.glow*st.wick[i]})`);g.addColorStop(1,"rgba(255,160,60,0)");lc.fillStyle=g;lc.fillRect(x-r,y-r,2*r,2*r)}
  cx.setTransform(1,0,0,1,0,0);cx.drawImage(litC,0,0);cx.setTransform(DPR,0,0,DPR,0,0);
  // streak studs on the foot: one per day in a row, up to 14
  const sk=Math.min(14,(st.data&&st.data.streak)||0);
  for(let k=0;k<14;k++){const a=(25+130*(k+.5)/14)*Math.PI/180,x=LX+Math.cos(a)*67*S,y=LY+(-13+Math.sin(a)*67*SQ*.85)*S;
    if(k<sk){cx.fillStyle=`rgba(255,200,90,${.25+.2*st.glow})`;cx.beginPath();cx.arc(x,y,2,0,6.3);cx.fill();cx.fillStyle="#ffe7a6";cx.beginPath();cx.arc(x,y,.9,0,6.3);cx.fill()}
    else{cx.fillStyle="rgba(60,35,5,.55)";cx.beginPath();cx.arc(x,y,.8,0,6.3);cx.fill()}}
  cx.save();cx.translate(LX,LY);cx.scale(S,S);

    cx.strokeStyle="#eadcbc";cx.lineWidth=2.4;cx.lineCap="round";cx.beginPath();cx.moveTo(x-Math.cos(p.a)*6,y+1);cx.quadraticCurveTo(x,y,x+Math.cos(p.a)*1.5,y-4);cx.stroke();

    cx.fillStyle=`rgba(255,215,150,${.45*st.glow})`;cx.beginPath();cx.ellipse(p.x*.72,BY+3,7*k,1.6,0,0,6.3);cx.fill();

  cx.restore();
  if(!reduce&&Math.random()<dt*(1+5*st.glow))st.sparks.push({x:0,y:0,vx:(Math.random()-.5)*.6,vy:-.6-Math.random()*1.2,life:1});

    for(let i=0;i<3;i++){const ph=(t*.4+i/3)%1;cx.globalAlpha=1-ph;cx.fillText("z",front.x+10+ph*10,front.y-30-ph*24)}cx.globalAlpha=1}
  if(st.focus){const f=Math.max(0,(st.focus.end-Date.now())/(25*60e3));cx.strokeStyle="rgba(255,190,90,.8)";cx.lineWidth=3;cx.lineCap="round";
    cx.beginPath();cx.arc(LX,LY-262*S,10,-Math.PI/2,-Math.PI/2+f*Math.PI*2);cx.stroke();if(f<=0)stopFocus(true)}
  requestAnimationFrame(frame);
}
