<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tharavad</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="tharavad.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://mbbucsageoyxhekzbmyq.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tharavad control room. Same tokens as Ambalam (index.html); one column, view tabs, the tree as nested lists. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunken:#F2F4F7; --ink:#1C2430; --muted:#4B5565; --faint:#5D6675;
  --line:#E4E7EC; --line-strong:#CDD3DC;
  --accent:#3B5B8C; --accent-soft:#EAF0F8; --strong:#3B5B8C; --on-strong:#FFFFFF; --danger:#A63D33; --danger-soft:#FBEAE7;
  --warn:#875400; --warn-soft:#FBF0DC; --ok:#26683F; --ok-soft:#DDEFE3; --plan:#4F5FA8; --plan-soft:#E8EBF7;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121418; --surface:#181B20; --sunken:#0C0E11; --ink:#E8EBF0; --muted:#B3BAC5; --faint:#9199A5;
  --line:#262B33; --line-strong:#363D47;
  --accent:#8FB0E0; --accent-soft:#1A2436; --strong:#7E9FD1; --on-strong:#0E1420; --danger:#FF8A80; --danger-soft:#2E1715;
  --warn:#F2B65A; --warn-soft:#2E2412; --ok:#6FD39A; --ok-soft:#12291D; --plan:#A9B5F0; --plan-soft:#1E2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#181B20; --sunken:#0C0E11; --ink:#E8EBF0; --muted:#B3BAC5; --faint:#9199A5;
  --line:#262B33; --line-strong:#363D47;
  --accent:#8FB0E0; --accent-soft:#1A2436; --strong:#7E9FD1; --on-strong:#0E1420; --danger:#FF8A80; --danger-soft:#2E1715;
  --warn:#F2B65A; --warn-soft:#2E2412; --ok:#6FD39A; --ok-soft:#12291D; --plan:#A9B5F0; --plan-soft:#1E2340; color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px}
h1{font:700 1.35rem var(--display);margin:0;letter-spacing:-.01em}
.stamp{color:var(--faint);font-size:.82rem}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav a{color:var(--muted);text-decoration:none;font-weight:500;font-size:.9rem;padding:8px 12px;border-radius:10px;min-height:40px;display:inline-flex;align-items:center;gap:6px}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.count{font:600 .72rem var(--mono);background:var(--danger);color:var(--on-strong);border-radius:9px;padding:0 6px}
main{padding-block:18px 48px;display:grid;gap:22px}
h2{font:700 1.1rem var(--display);margin:0 0 4px}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.banner{border-radius:12px;padding:12px 14px;font-weight:500}
.banner.stop{background:var(--danger-soft);color:var(--danger)}
.banner.away{background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.kpi .l{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.kpi b{display:block;font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:.8rem}
.pill{display:inline-flex;align-items:center;font:600 .72rem var(--mono);border-radius:999px;padding:2px 8px;white-space:nowrap}
.h-green{color:var(--ok);background:var(--ok-soft)} .h-amber{color:var(--warn);background:var(--warn-soft)} .h-red{color:var(--danger);background:var(--danger-soft)} .h-unknown{color:var(--muted);background:var(--sunken)} .h-planned,.h-paused,.h-retired{color:var(--plan);background:var(--plan-soft)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-green{background:var(--ok)} .d-amber{background:var(--warn)} .d-red{background:var(--danger)} .d-unknown{background:var(--line-strong)} .d-planned,.d-paused,.d-retired{background:var(--plan)}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:18px;border-left:1px solid var(--line);padding-left:12px}
.unit{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;min-width:0}
.unit .nm{font-weight:600}
.unit .meta{color:var(--muted);font-size:.82rem}
.unit .dots{display:inline-flex;gap:4px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:6px}
.list{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.row .t{min-width:0;flex:1 1 280px}
.row .t b{display:block}
.row .t span{color:var(--muted);font-size:.84rem}
.steps{margin:4px 0 0;padding-left:20px;color:var(--ink);font-size:.88rem}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:7px 12px;min-height:40px;font-weight:500}
.btn.primary{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.86rem}
th{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunken)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:.85rem}
dt{color:var(--muted)} dd{margin:0;min-width:0}
.login{max-width:380px;margin:12vh auto;display:grid;gap:12px}
.login input{border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:var(--surface)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
@media (max-width:820px){.btn,nav a{min-height:44px}}
</style>
</head>
<body>
<header><div class="wrap hrow"><h1>Tharavad</h1><span class="stamp" id="stamp"></span>
<nav aria-label="Views" id="nav">
  <a href="#overview">Overview</a><a href="#queue">Your queue <span class="count" id="qn" hidden></span></a><a href="#agents">Agents and runs</a><a href="#companies">Companies</a><a href="#controls">Controls</a>
</nav></div></header>
<div class="wrap"><main id="view" aria-live="polite"></main></div>
<script>
const SB_URL="https://mbbucsageoyxhekzbmyq.supabase.co";
const SB_KEY="sb_publishable_mVoEHUZ40dF4cp-jRF__IA_hObDMvif";
const sb=supabase.createClient(SB_URL,SB_KEY);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const V=document.getElementById("view");
const VIEWS=["overview","queue","agents","companies","controls"];
const H={green:"Healthy",amber:"Watch",red:"Silent",unknown:"Unknown",planned:"Not built",paused:"Paused",retired:"Retired"};
const D={flags:{},companies:[],projects:[],econ:[],health:[],runs:[],asks:[],alarms:[],report:null,ready:false};
const ist=t=>t?new Date(t).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false}):"—";
const inr=n=>{const v=Math.round(Number(n)||0);return (v<0?"−":"")+"₹"+Math.abs(v).toLocaleString("en-IN")};
const monthNow=()=>{const d=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"}));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`};
const pname=id=>D.projects.find(p=>p.id===id)?.name||id;
const flag=k=>{const v=D.flags[k];return v===true||v==="true"};
const pill=h=>`<span class="pill h-${esc(h)}">${esc(H[h]||h)}</span>`;
let pending=null; // inline confirmation: {kind, id}

async function load(){
  const [f,c,p,e,h,r,a,al,rep]=await Promise.all([
    sb.from("tharavad_flags").select("key,value"),
    sb.from("companies").select("project_id,kind,tier,stage,key_metric,target_90d,budget_cap_monthly,currency,core_channel,brand_mode,paused_at,head_agent,scorecard"),
    sb.from("projects").select("id,name,parent_id,archived_at"),
    sb.from("unit_economics").select("project_id,month,revenue_inr,cost_inr,contribution_inr"),
    sb.from("agent_health").select("id,name,level,kind,project_id,cadence,status,health,last_evidence,last_status,last_summary,runs_7d,fails_in_row"),
    sb.from("runs").select("id,agent_id,started_at,ended_at,status,summary,error").order("started_at",{ascending:false}).limit(40),
    sb.from("asks").select("id,project_id,agent_id,type,title,why,unblocks,steps,link,est_minutes,deadline,fallback,status,created_at").eq("status","open").order("deadline",{ascending:true}),
    sb.from("alarms").select("id,kind,project_id,agent_id,message,created_at,acked_at").is("acked_at",null).order("created_at",{ascending:false}),
    sb.from("notes").select("title,body,created_at").contains("tags",["weekly-report"]).order("created_at",{ascending:false}).limit(1)
  ]);
  D.flags=Object.fromEntries((f.data||[]).map(x=>[x.key,x.value]));
  D.companies=c.data||[];D.projects=p.data||[];D.econ=e.data||[];D.health=h.data||[];D.runs=r.data||[];D.asks=a.data||[];D.alarms=al.data||[];D.report=(rep.data||[])[0]||null;
  D.ready=true;render();
}

function render(){
  const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"overview";
  document.querySelectorAll("#nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false"));
  const n=D.asks.length+D.alarms.length,qn=document.getElementById("qn");qn.hidden=!n;qn.textContent=n;
  document.getElementById("stamp").textContent=D.ready?"updated "+ist(new Date()):"loading…";
  if(!D.ready){V.innerHTML=`<p class="empty">Loading Tharavad…</p>`;return}
  V.innerHTML=banners()+({overview,queue,agents,companies,controls}[v])();
}
function banners(){
  return (flag("stop_all")?`<div class="banner stop">Everything is stopped. No run starts and no external action goes out until you resume it in Controls.</div>`:"")
    +(flag("away")?`<div class="banner away">Away mode is on: veto windows are paused and class C calls wait for you.</div>`:"");
}

/* ---------- Overview ---------- */
function overview(){
  const m=monthNow(),mon=D.econ.filter(x=>x.month===m&&x.project_id==="group-hq")[0]||{revenue_inr:0,cost_inr:0,contribution_inr:0};
  const live=D.health.filter(a=>a.status==="active"),bad=live.filter(a=>a.health==="red"||a.health==="amber");
  const mins=D.asks.reduce((s,a)=>s+(a.est_minutes||0),0);
  return `<section><div class="kpis">
    <div class="kpi"><span class="l">This month</span><b>${inr(mon.revenue_inr)}</b><small>revenue · cost ${inr(mon.cost_inr)}</small></div>
    <div class="kpi"><span class="l">Contribution</span><b>${inr(mon.contribution_inr)}</b><small>revenue minus every cost</small></div>
    <div class="kpi"><span class="l">Your queue</span><b>${D.asks.length}</b><small>about ${mins} min · ${D.alarms.length} alarm${D.alarms.length===1?"":"s"}</small></div>
    <div class="kpi"><span class="l">Agents</span><b>${live.length-bad.length} of ${live.length}</b><small>healthy · ${bad.length} need a look</small></div>
  </div></section>
  <section><h2>The family tree</h2><p class="sub">Tharavad, its companies and products. Dots are the agents on each unit; tap a company in Companies for its numbers.</p>${tree()}</section>
  ${D.report?`<section><h2>${esc(D.report.title)}</h2><p class="sub">The Karanavar's latest board report, ${ist(D.report.created_at)}.</p><div class="card" style="white-space:pre-wrap">${esc(D.report.body)}</div></section>`:`<section><h2>Board report</h2><p class="empty">The Karanavar's first report arrives Monday 07:41.</p></section>`}`;
}
function tree(){
  const units=new Set(D.companies.map(c=>c.project_id));
  const kids=id=>D.projects.filter(p=>p.parent_id===id&&!p.archived_at&&(units.has(p.id)||D.projects.some(q=>q.parent_id===p.id&&units.has(q.id))));
  const node=p=>{const c=D.companies.find(x=>x.project_id===p.id)||{},ag=D.health.filter(a=>a.project_id===p.id),ch=kids(p.id);
    return `<li><div class="unit"><span class="nm">${esc(p.name)}</span><span class="meta">${esc([c.kind,c.stage,c.paused_at?"paused":""].filter(Boolean).join(" · "))}</span>
      <span class="dots">${ag.map(a=>`<span class="dot d-${esc(a.status==="active"?a.health:a.status)}" title="${esc(a.name+": "+(H[a.status==="active"?a.health:a.status]||""))}"></span>`).join("")}</span></div>
      ${ch.length?`<ul>${ch.map(node).join("")}</ul>`:""}</li>`};
  const root=D.projects.find(p=>p.id==="group-hq");
  return root?`<ul class="tree">${node(root)}</ul>`:`<p class="empty">No units yet.</p>`;
}

/* ---------- Queue ---------- */
function queue(){
  const al=D.alarms.map(a=>`<div class="card"><div class="row"><div class="t"><b>${esc(a.message)}</b><span>${esc(a.kind)} · ${esc(a.project_id?pname(a.project_id):"Tharavad")} · ${ist(a.created_at)}</span></div>
    <div class="acts"><button class="btn" data-ack="${a.id}">Seen</button></div></div></div>`).join("");
  const as=D.asks.map(a=>{const steps=Array.isArray(a.steps)?a.steps:[],late=a.deadline&&new Date(a.deadline)<new Date();
    const conf=pending&&pending.kind==="drop"&&pending.id===a.id;
    return `<div class="card"><div class="row"><div class="t"><b>${esc(a.title)}</b>
      <span>${esc(a.type)} · ${esc(pname(a.project_id))}${a.est_minutes?` · ${a.est_minutes} min`:""}${a.deadline?` · due ${ist(a.deadline)}${late?" (late)":""}`:""}</span></div>
      <div class="acts">${conf?`<span class="confirm">Drop it? The agent falls back to: ${esc(a.fallback||"nothing")} <button class="btn danger" data-dropyes="${a.id}">Drop</button><button class="btn" data-cancel>Keep</button></span>`
        :`<button class="btn primary" data-done="${a.id}">Done</button><button class="btn" data-drop="${a.id}">Can't do</button>`}</div></div>
      ${a.why?`<div>${esc(a.why)}</div>`:""}${a.unblocks?`<div class="sub" style="margin:0">Unblocks: ${esc(a.unblocks)}</div>`:""}
      ${steps.length?`<ol class="steps">${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:""}
      ${a.link?`<div><a href="${esc(a.link)}" target="_blank" rel="noopener">Open link</a></div>`:""}</div>`}).join("");
  return `<section><h2>Alarms</h2><p class="sub">Sent by the database itself; they also reach your phone through ntfy.</p><div class="list">${al||`<p class="empty">No open alarms.</p>`}</div></section>
  <section><h2>Your queue</h2><p class="sub">Only what needs your hands: logins, payments, submissions, approvals. Each also sits in Ambalam's Today; finishing it here closes it there.</p><div class="list">${as||`<p class="empty">Nothing waiting on you.</p>`}</div></section>`;
}

/* ---------- Agents and runs ---------- */
function agents(){
  const rows=[...D.health].sort((a,b)=>({red:0,amber:1,unknown:2,green:3}[a.health]??4)-({red:0,amber:1,unknown:2,green:3}[b.health]??4));
  return `<section><h2>Agents</h2><p class="sub">Health comes from each agent's own run reports, with its writes to the hub as a fallback, never from the scheduler.</p>
  <div class="tablewrap"><table><thead><tr><th>Agent</th><th>Unit</th><th>Schedule</th><th>Last evidence</th><th>Runs 7d</th><th>Health</th></tr></thead><tbody>
  ${rows.map(a=>`<tr><td><b>${esc(a.name)}</b>${a.last_summary?`<div class="sub" style="margin:0">${esc(a.last_summary)}</div>`:""}</td><td>${esc(a.project_id?pname(a.project_id):"Tharavad")}</td><td class="mono">${esc(a.cadence||"—")}</td><td class="mono">${ist(a.last_evidence)}</td><td class="mono">${a.runs_7d??0}${a.fails_in_row?` · ${a.fails_in_row} failed`:""}</td><td>${pill(a.status==="active"?a.health:a.status)}</td></tr>`).join("")}
  </tbody></table></div></section>
  <section><h2>Recent runs</h2><div class="tablewrap"><table><thead><tr><th>Agent</th><th>Started</th><th>Ended</th><th>Status</th><th>Summary</th></tr></thead><tbody>
  ${D.runs.length?D.runs.map(r=>`<tr><td>${esc(D.health.find(a=>a.id===r.agent_id)?.name||r.agent_id)}</td><td class="mono">${ist(r.started_at)}</td><td class="mono">${ist(r.ended_at)}</td><td>${esc(r.status)}</td><td>${esc(r.summary||r.error||"")}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">No run has reported yet. The first is the KTN run on Wed 25 Nov.</td></tr>`}
  </tbody></table></div></section>`;
}

/* ---------- Companies ---------- */
function companies(){
  const m=monthNow(),list=D.companies.filter(c=>c.kind==="company"||c.kind==="test");
  return `<section><h2>Companies</h2><p class="sub">Placed by how they reach customers. Money is this month, from Treasury's view, in rupees.</p><div class="cos">${list.map(c=>{
    const e=D.econ.find(x=>x.project_id===c.project_id&&x.month===m)||{},sc=c.scorecard||{},prods=D.companies.filter(x=>x.kind==="product"&&D.projects.find(p=>p.id===x.project_id)?.parent_id===c.project_id),ag=D.health.filter(a=>a.project_id===c.project_id);
    const conf=pending&&pending.kind==="pause"&&pending.id===c.project_id;
    return `<article class="card"><div class="row"><div class="t"><b style="font:700 1.02rem var(--display)">${esc(pname(c.project_id))}</b><span>${esc([c.kind==="test"?"company in test":c.brand_mode==="studio"?"studio":"company",c.stage,c.paused_at?"paused":""].filter(Boolean).join(" · "))}</span></div>
      <div class="acts">${conf?`<span class="confirm">${c.paused_at?"Resume":"Pause"} ${esc(pname(c.project_id))}? <button class="btn ${c.paused_at?"primary":"danger"}" data-pauseyes="${esc(c.project_id)}">${c.paused_at?"Resume":"Pause"}</button><button class="btn" data-cancel>Cancel</button></span>`:`<button class="btn" data-pause="${esc(c.project_id)}">${c.paused_at?"Resume":"Pause"}</button>`}</div></div>
      <dl><dt>Key number</dt><dd>${esc(sc.primary?.metric||c.key_metric||"—")}</dd><dt>90-day target</dt><dd>${esc(sc.primary?.target_90d??c.target_90d??"—")}</dd>
      <dt>Core channel</dt><dd>${esc(c.core_channel||"—")}</dd><dt>This month</dt><dd class="mono">${inr(e.revenue_inr)} in · ${inr(e.cost_inr)} out · ${inr(e.contribution_inr)}</dd>
      <dt>Cap</dt><dd class="mono">${c.budget_cap_monthly!=null?esc((c.currency==="USD"?"$":"₹")+c.budget_cap_monthly):"—"}</dd></dl>
      ${prods.length?`<div class="sub" style="margin:0">Products: ${prods.map(x=>esc(pname(x.project_id))).join(", ")}</div>`:""}
      <div class="acts">${ag.length?ag.map(a=>pill(a.status==="active"?a.health:a.status).replace("</span>"," · "+esc(a.name)+"</span>")).join(""):`<span class="pill h-unknown">No agents yet</span>`}</div></article>`}).join("")}</div></section>`;
}

/* ---------- Controls ---------- */
function controls(){
  const stop=flag("stop_all"),away=flag("away"),conf=pending&&pending.kind==="flag";
  const sw=(k,on,label,desc)=>`<div class="card"><div class="row"><div class="t"><b>${label}: ${on?"on":"off"}</b><span>${desc}</span></div><div class="acts">
    ${conf&&pending.id===k?`<span class="confirm">Turn ${on?"off":"on"}? <button class="btn ${k==="stop_all"&&!on?"danger":"primary"}" data-flagyes="${k}">Yes</button><button class="btn" data-cancel>Cancel</button></span>`:`<button class="btn ${k==="stop_all"&&!on?"danger":""}" data-flag="${k}">${on?"Turn off":"Turn on"}</button>`}</div></div></div>`;
  return `<section><h2>Controls</h2><p class="sub">These are database switches every run checks first, so they work even if Claude or an agent misbehaves.</p><div class="list">
    ${sw("stop_all",stop,"Stop everything","No run starts and no upload, send or payment step goes out. Use it if anything looks wrong.")}
    ${sw("away",away,"Away mode","While you travel: veto windows pause and class C calls wait; routine work carries on.")}
  </div></section>`;
}

/* ---------- actions ---------- */
async function act(fn,ok){try{const{error}=await fn();if(error)throw error;pending=null;await load()}catch(e){pending=null;render();alertLine("That didn't save. Check your connection and try again.")}}
function alertLine(t){const d=document.createElement("div");d.className="banner stop";d.textContent=t;V.prepend(d);setTimeout(()=>d.remove(),5000)}
V.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.ack)return act(()=>sb.from("alarms").update({acked_at:new Date().toISOString()}).eq("id",+d.ack));
  if(d.done)return act(()=>sb.from("asks").update({status:"done",done_at:new Date().toISOString()}).eq("id",+d.done));
  if(d.drop){pending={kind:"drop",id:+d.drop};return render()}
  if(d.dropyes)return act(()=>sb.from("asks").update({status:"dropped",done_at:new Date().toISOString()}).eq("id",+d.dropyes));
  if(d.pause){pending={kind:"pause",id:d.pause};return render()}
  if(d.pauseyes){const c=D.companies.find(x=>x.project_id===d.pauseyes);return act(()=>sb.from("companies").update({paused_at:c?.paused_at?null:new Date().toISOString()}).eq("project_id",d.pauseyes))}
  if(d.flag){pending={kind:"flag",id:d.flag};return render()}
  if(d.flagyes)return act(()=>sb.from("tharavad_flags").update({value:!flag(d.flagyes),updated_at:new Date().toISOString()}).eq("key",d.flagyes));
  if("cancel" in d){pending=null;render()}});
addEventListener("hashchange",()=>{pending=null;render()});

/* ---------- boot: same sign-in as Ambalam ---------- */
function showLogin(msg){V.innerHTML=`<form class="login" id="loginForm"><h2>Tharavad</h2><p class="sub">${esc(msg||"Sign in with your email. We'll send you a link.")}</p><input type="email" name="email" required placeholder="you@example.com" autocomplete="email" aria-label="Email"><button class="btn primary" type="submit">Send sign-in link</button></form>`;
  document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const{error}=await sb.auth.signInWithOtp({email:e.target.email.value.trim(),options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});
    showLogin(error?"That email can't sign in here. Check the address and try again.":"Check your inbox and tap the link.")})}
let started=false;
async function start(){if(started)return;started=true;render();await load();
  sb.channel("tharavad").on("postgres_changes",{event:"*",schema:"public",table:"asks"},load).on("postgres_changes",{event:"*",schema:"public",table:"alarms"},load)
    .on("postgres_changes",{event:"*",schema:"public",table:"runs"},load).on("postgres_changes",{event:"*",schema:"public",table:"tharavad_flags"},load).subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()})}
window.TH={start,load,D};
(async()=>{const{data:{session}}=await sb.auth.getSession();if(session)start();else showLogin();sb.auth.onAuthStateChange((ev,s)=>{if(s&&!started)start()})})();
</script>
