<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tharavad</title>
<meta name="theme-color" content="#F4F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="tharavad.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://mbbucsageoyxhekzbmyq.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tharavad control room.
   Layout: a sticky house bar (name, freshness, Tell Tharavad, views); every view opens with its one-line state,
   then summary cards, then detail. The family tree is an org chart: the house on top, a beam, companies hanging from it.
   Palette: backwater teal for the house's own voice, green/amber/red only for state, cool green-grey neutrals. */
:root{
  --bg:#F4F6F4; --surface:#FFFFFF; --sunken:#EAEEEB; --ink:#16201C; --muted:#45524C; --faint:#56625C;
  --line:#DCE2DE; --line-strong:#B9C3BD;
  --accent:#1D5B55; --accent-soft:#DFEDEA; --on-accent:#FFFFFF;
  --ok:#22683D; --ok-soft:#DCEFE2; --warn:#855500; --warn-soft:#FAEFD8; --danger:#A3352A; --danger-soft:#FBE6E2;
  --plan:#4A59A3; --plan-soft:#E6E9F6; --hatch:rgba(22,32,28,.06);
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#161D1A; --sunken:#0A0E0C; --ink:#E5ECE8; --muted:#AFBAB4; --faint:#939F98;
  --line:#25302B; --line-strong:#3A4842;
  --accent:#7EC6BB; --accent-soft:#13302C; --on-accent:#06201C;
  --ok:#72D49C; --ok-soft:#11291C; --warn:#F0B85A; --warn-soft:#2C230F; --danger:#FF8F84; --danger-soft:#35150F;
  --plan:#AAB6F2; --plan-soft:#1D2240; --hatch:rgba(229,236,232,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161D1A; --sunken:#0A0E0C; --ink:#E5ECE8; --muted:#AFBAB4; --faint:#939F98;
  --line:#25302B; --line-strong:#3A4842;
  --accent:#7EC6BB; --accent-soft:#13302C; --on-accent:#06201C;
  --ok:#72D49C; --ok-soft:#11291C; --warn:#F0B85A; --warn-soft:#2C230F; --danger:#FF8F84; --danger-soft:#35150F;
  --plan:#AAB6F2; --plan-soft:#1D2240; --hatch:rgba(229,236,232,.05); color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* house bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.brand b{font:800 1.3rem/1 var(--display);letter-spacing:-.02em}
.stamp{color:var(--faint);font:400 .76rem var(--mono);white-space:nowrap}
.stamp .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.stamp.stale .live{background:var(--warn)}
nav{display:flex;gap:2px;order:3;flex:1 1 auto;justify-content:flex-start}
nav a{color:var(--muted);text-decoration:none;font-weight:500;font-size:.9rem;padding:6px 11px;border-radius:999px;min-height:38px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
nav a:hover{color:var(--ink);background:var(--sunken)}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.count{font:600 .7rem var(--mono);background:var(--danger);color:var(--surface);border-radius:9px;padding:1px 6px;line-height:1.3}
nav a[aria-current="page"] .count{background:var(--bg);color:var(--danger)}
.tell-open{margin-left:auto;order:2}
@media (min-width:1000px){nav{order:2;flex:0 1 auto;margin-left:8px}.tell-open{order:3}}

/* type + structure */
main{padding-block:20px 64px;display:grid;gap:28px}
section{display:grid;gap:12px;min-width:0}
h2{font:700 1.18rem/1.2 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font:700 1rem/1.25 var(--display);margin:0;text-wrap:balance}
.eyebrow{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sub{color:var(--muted);font-size:.88rem;margin:0;max-width:68ch}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
.shead .sub{flex:1 1 100%}
.ticks.plain li::before{display:none}
.empty{color:var(--muted);font-size:.9rem;padding:14px 16px;border:1px dashed var(--line-strong);border-radius:var(--r);margin:0}
.mono{font-family:var(--mono);font-size:.82em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--danger)}

/* surfaces */
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:grid;gap:8px;min-width:0;align-content:start}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.list{display:grid;gap:10px}
.row{display:flex;gap:8px 14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.row>.t{min-width:0;flex:1 1 260px}
.meta{color:var(--muted);font-size:.83rem;display:flex;flex-wrap:wrap;gap:2px 10px}
.meta>span:not(:last-child)::after{content:"·";margin-left:10px;color:var(--line-strong)}

/* state marks */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 .7rem/1.4 var(--mono);border-radius:999px;padding:2px 9px;white-space:nowrap;letter-spacing:.02em}
.h-green,.s-succeeded,.s-passed,.s-done,.s-yes{color:var(--ok);background:var(--ok-soft)}
.h-amber,.s-blocked,.s-iterating,.s-skipped,.p-med,.s-parked{color:var(--warn);background:var(--warn-soft)}
.h-red,.s-failed,.s-killed,.p-high,.s-no,.s-dropped{color:var(--danger);background:var(--danger-soft)}
.h-unknown,.p-low,.s-expired,.k-plain{color:var(--muted);background:var(--sunken)}
.h-planned,.h-paused,.h-retired,.s-planned,.s-new,.s-routed{color:var(--plan);background:var(--plan-soft)}
.s-running,.s-in_progress,.k-accent{color:var(--accent);background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:var(--line-strong)}
.d-green{background:var(--ok)} .d-amber{background:var(--warn)} .d-red{background:var(--danger)} .d-unknown{background:transparent;border:2px solid var(--faint)} .d-planned,.d-paused,.d-retired{background:transparent;border:2px dashed var(--plan)}
.dots{display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:7px 14px;min-height:40px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:var(--surface)}
.btn.danger.solid{background:var(--danger);color:var(--surface)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--sunken)}
.btn[disabled]{opacity:.6;cursor:progress}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.confirm{display:grid;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunken);font-size:.88rem;width:100%}
.confirm.bad{background:var(--danger-soft);color:var(--ink)}
.confirm p{margin:0}

/* banners + toast */
.banner{border-radius:var(--r);padding:12px 16px;font-weight:500;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.stop{background:var(--danger);color:var(--surface)}
.banner.stop a{color:var(--surface);font-weight:600}
.banner.away{background:var(--warn-soft);color:var(--warn)}
.banner.err{background:var(--danger-soft);color:var(--danger)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
#toast.bad{background:var(--danger);color:var(--surface)}

/* home: the state line */
.state{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center;padding-block:6px 4px}
.lamp{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;grid-row:span 2}
.lamp::after{content:"";width:22px;height:22px;border-radius:50%;background:currentColor}
.lamp.ok{color:var(--ok);background:var(--ok-soft)} .lamp.need{color:var(--warn);background:var(--warn-soft)} .lamp.bad{color:var(--danger);background:var(--danger-soft)}
.state h2{font:800 clamp(1.7rem,4.2vw,2.5rem)/1.05 var(--display);letter-spacing:-.025em}
.state .sub{font-size:.95rem}
.needs{display:flex;flex-wrap:wrap;gap:8px;grid-column:1/-1;margin-top:8px}
.need{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 8px;text-decoration:none;color:var(--ink);font-size:.88rem;min-height:40px}
.need b{font:700 .95rem var(--display);min-width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;padding:0 6px}
.need.a b{background:var(--danger-soft);color:var(--danger)} .need.q b{background:var(--warn-soft);color:var(--warn)} .need.p b{background:var(--plan-soft);color:var(--plan)} .need.v b{background:var(--accent-soft);color:var(--accent)}
.need:hover{border-color:var(--ink)}

/* figures */
.fig{display:grid;gap:2px}
.fig .v{font:700 1.65rem/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fig .v.sm{font-size:1.2rem}
.fig small{color:var(--muted);font-size:.8rem}
.figs{display:flex;flex-wrap:wrap;gap:12px 28px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:500 12.5px var(--mono);fill:var(--faint)}
.chart .end{fill:var(--ink);font-weight:600}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--line-strong);stroke-width:1.5}
.c-rev{fill:var(--ok);opacity:.8} .c-cost{fill:var(--danger);opacity:.55}
.c-line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.c-dot{fill:var(--ink)} .c-dot.last{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .l-rev{background:var(--ok)} .legend .l-cost{background:var(--danger);opacity:.6} .legend .l-con{background:var(--ink);height:3px;border-radius:2px;vertical-align:3px}
.hbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunken);gap:2px}
.hbar span{display:block;height:100%}
.hbar .green{background:var(--ok)} .hbar .amber{background:var(--warn)} .hbar .red{background:var(--danger)} .hbar .unknown{background:var(--line-strong)}
.meter{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.over span{background:var(--danger)}
.spark{width:64px;height:20px;display:block}
.spark path{fill:none;stroke:var(--muted);stroke-width:1.5}
.spark circle{fill:var(--accent)}

/* board report */
.report{max-width:72ch;display:grid;gap:10px;font-size:.95rem}
.report h3{font-size:1.1rem;margin-top:6px} .report h4{font:700 .98rem var(--display);margin:6px 0 0} .report h5{font:600 .8rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:4px 0 0}
.report p,.report ul,.report ol{margin:0}
.report ul,.report ol{padding-left:22px;display:grid;gap:3px}
.report hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.report code{font:.85em var(--mono);background:var(--sunken);padding:1px 5px;border-radius:5px}
.report strong{font-weight:600}
.clip{max-height:340px;overflow:hidden;position:relative}
.clip::after{content:"";position:absolute;inset:auto 0 0;height:64px;background:linear-gradient(transparent,var(--surface))}

/* family tree: org chart */
.org{display:grid;justify-items:center}
.org-root{width:min(100%,460px);text-align:center;justify-items:center;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.org-root .meta{color:var(--bg);opacity:.8;justify-content:center}
.org-root .meta>span:not(:last-child)::after{color:var(--bg)}
.org-root h3{font-size:1.5rem;font-weight:800}
.org-trunk{width:2px;height:26px;background:var(--line-strong)}
.org-row{--cols:3;width:100%;position:relative;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:30px 16px;padding-top:26px}
.org-row::before{content:"";position:absolute;top:0;height:2px;background:var(--line-strong);left:calc((100% - (var(--cols) - 1) * 16px) / var(--cols) / 2);right:calc((100% - (var(--cols) - 1) * 16px) / var(--cols) / 2)}
.org-co{position:relative;align-content:start}
.org-co.top::before{content:"";position:absolute;top:-27px;left:50%;width:2px;height:26px;background:var(--line-strong)}
.org-co.paused{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--hatch) 10px 20px)}
.org-co.test{border-style:dashed;border-color:var(--line-strong)}
.co-link{color:var(--ink);text-decoration:none}
.co-link::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.org-co:hover{border-color:var(--ink)}
.org-co .kids{display:grid;gap:6px;margin-top:4px;position:relative;z-index:1}
.kid{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-sm);background:var(--sunken);text-decoration:none;color:var(--ink);font-size:.86rem;min-height:40px}
.kid:hover{outline:1px solid var(--line-strong)}
.kid .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.kid .tag{font:500 .66rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.kid.test{background:transparent;border:1px dashed var(--line-strong)}
.co-money{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
@media (max-width:760px){
  .org{justify-items:stretch}
  .org-root{text-align:left;justify-items:start;width:100%}
  .org-root .meta{justify-content:flex-start}
  .org-trunk{margin-left:22px}
  .org-row{--cols:1!important;padding-top:0;margin-left:22px;width:calc(100% - 22px);border-left:2px solid var(--line-strong);padding-left:16px;gap:14px;padding-block:14px 0}
  .org-row::before{display:none}
  .org-co.top::before,.org-co::before{content:"";position:absolute;top:26px;left:-18px;width:16px;height:2px;background:var(--line-strong)}
}

/* company page */
.co-head{display:grid;gap:10px}
.co-head h2{font:800 clamp(1.6rem,4vw,2.3rem)/1.05 var(--display);letter-spacing:-.02em}
.back{font-size:.86rem;text-decoration:none;display:inline-flex;align-items:center;min-height:36px}
dl.kv{display:grid;grid-template-columns:minmax(90px,max-content) 1fr;gap:6px 16px;margin:0;font-size:.9rem}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.primary-metric{border-radius:var(--r-sm);background:var(--accent-soft);padding:12px 14px;display:grid;gap:2px}
.primary-metric .eyebrow{color:var(--accent)}
.primary-metric b{font:700 1.15rem var(--display)}
.ticks{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:.88rem}
.ticks li{display:flex;gap:8px;align-items:baseline}
.ticks li::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--line-strong);transform:translateY(-1px)}
.ticks.guard li::before{background:transparent;border:1.5px solid var(--danger);border-radius:50%}
.ticks.kill li::before{background:var(--danger);border-radius:1px;width:7px;height:7px}
.steps{margin:0;padding-left:22px;font-size:.9rem;display:grid;gap:3px}
.why{font-size:.92rem;margin:0}
.kvline{font-size:.86rem;color:var(--muted);margin:0}
.kvline b{color:var(--ink);font-weight:600}

/* queue */
.qcard{border-left-width:4px}
.qcard.alarm{border-left-color:var(--danger)}
.qcard.ask{border-left-color:var(--warn)}
.qcard.ask.late{border-left-color:var(--danger)}
.qcard.prop{border-left-color:var(--plan)}
.qcard.veto{border-left-color:var(--accent)}
.due{font:600 .76rem var(--mono);white-space:nowrap}
.due.late{color:var(--danger)}
.mins{font:700 .9rem var(--display);color:var(--muted);white-space:nowrap}
.score{font:800 1.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}

/* agents */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;min-height:36px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.agent{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.agent summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;cursor:pointer;min-height:44px}
.agent summary::-webkit-details-marker{display:none}
.agent summary .nm{font-weight:600}
.agent[open] summary{border-bottom:1px solid var(--line)}
.agent .body{padding:12px 14px 14px;display:grid;gap:10px;font-size:.9rem}
.agent .handoff{white-space:pre-wrap;font:.84rem/1.5 var(--mono);background:var(--sunken);border-radius:var(--r-sm);padding:10px 12px;margin:0;max-height:320px;overflow:auto}
.lvl{display:grid;gap:8px}
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tl{border-collapse:separate;border-spacing:3px;font-size:.82rem;padding:8px}
table.tl th{font:500 .66rem var(--mono);color:var(--faint);text-align:center;padding:0 0 4px;white-space:nowrap}
table.tl th.who{text-align:left;padding-right:10px;font:500 .84rem var(--sans);color:var(--ink);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
table.tl td{width:24px;height:24px;border-radius:5px;background:var(--sunken);text-align:center;font:600 .66rem var(--mono);color:var(--surface)}

/* simple markdown: headings, bullets, numbered, rules, bold, code, links */
function md(src){
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[];let list=null,para=[];
  const flushP=()=>{if(para.length){out.push(`<p>${para.map(inl).join(" ")}</p>`);para=[]}};
  const flushL=()=>{if(list){out.push(`<${list.t}>${list.items.map(i=>`<li>${inl(i)}</li>`).join("")}</${list.t}>`);list=null}};
  for(const raw of String(src||"").split(/\r?\n/)){const l=raw.trim();let m;
    if(!l){flushP();flushL();continue}
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(l)){flushP();flushL();out.push("<hr>");continue}
    if(m=l.match(/^(#{1,4})\s+(.*)$/)){flushP();flushL();const h=Math.min(5,m[1].length+2);out.push(`<h${h}>${inl(m[2].replace(/\*\*/g,""))}</h${h}>`);continue}
    if(m=l.match(/^[-*•]\s+(.*)$/)){flushP();if(!list||list.t!=="ul"){flushL();list={t:"ul",items:[]}}list.items.push(m[1]);continue}
    if(m=l.match(/^\d+[.)]\s+(.*)$/)){flushP();if(!list||list.t!=="ol"){flushL();list={t:"ol",items:[]}}list.items.push(m[1]);continue}
    flushL();para.push(l)}
  flushP();flushL();return out.join("")}

/* ---------- charts (hand-drawn SVG, one scale per chart) ---------- */
function moneyChart(rows,label){
  rows=rows.slice(-12);
  if(!rows.length||rows.every(r=>!+r.revenue_inr&&!+r.cost_inr))return `<p class="empty">No money has moved yet. Months appear here as Treasury records revenue and cost.</p>`;
  const W=420,Hh=172,L=50,R=54,T=14,B=24,iw=W-L-R,ih=Hh-T-B,n=rows.length,bw=Math.min(28,iw/n*.55);
  const hi=Math.max(1,...rows.map(r=>Math.max(+r.revenue_inr||0,+r.contribution_inr||0))),lo=Math.min(0,...rows.map(r=>Math.min(-(+r.cost_inr||0),+r.contribution_inr||0)));
  const y=v=>T+(hi-v)/(hi-lo)*ih,x=i=>L+iw*(i+.5)/n,z=y(0);
  const step=n>8?2:1;let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(label)}">`;
  s+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(hi)}" y2="${y(hi)}"/><text x="${L-6}" y="${y(hi)+4}" text-anchor="end">${esc(inrK(hi))}</text>`;
  if(lo<0)s+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(lo)}" y2="${y(lo)}"/><text x="${L-6}" y="${y(lo)+4}" text-anchor="end">${esc(inrK(lo))}</text>`;
  rows.forEach((r,i)=>{const rv=+r.revenue_inr||0,c=+r.cost_inr||0,cx=x(i);
    if(rv>0)s+=`<rect class="c-rev" x="${cx-bw/2}" y="${y(rv)}" width="${bw}" height="${z-y(rv)}" rx="2"><title>${esc(mon(r.month)+" revenue "+inr(rv))}</title></rect>`;
    if(c>0)s+=`<rect class="c-cost" x="${cx-bw/2}" y="${z}" width="${bw}" height="${y(-c)-z}" rx="2"><title>${esc(mon(r.month)+" cost "+inr(c))}</title></rect>`;
    if(i%step===(n-1)%step)s+=`<text x="${cx}" y="${Hh-6}" text-anchor="middle">${esc(mon(r.month))}</text>`});
  s+=`<line class="zero" x1="${L}" x2="${W-R}" y1="${z}" y2="${z}"/><text x="${L-6}" y="${z+4}" text-anchor="end">₹0</text>`;
  const pts=rows.map((r,i)=>[x(i),y(+r.contribution_inr||0)]);
  if(n>1)s+=`<path class="c-line" d="M${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join("L")}"/>`;
  pts.forEach((p,i)=>s+=`<circle class="c-dot${i===n-1?" last":""}" cx="${p[0]}" cy="${p[1]}" r="${i===n-1?5:3}"/>`);
  const last=rows[n-1];s+=`<text class="end" x="${pts[n-1][0]+9}" y="${pts[n-1][1]+4}">${esc(inrK(last.contribution_inr))}</text></svg>`;
  return s+`<div class="legend"><span><i class="l-rev"></i>Revenue</span><span><i class="l-cost"></i>Cost</span><span><i class="l-con"></i>Contribution</span></div>`}
function spark(id){const r=series(id).slice(-6);if(r.length<2)return "";
  const v=r.map(x=>+x.contribution_inr||0),hi=Math.max(...v),lo=Math.min(...v),sp=hi-lo||1,X=i=>2+i*(60/(r.length-1)),Y=x=>18-(x-lo)/sp*16;

/* ---------- load: every table once, render from memory ---------- */
let loading=null,again=false;
async function load(){
  if(loading){again=true;return loading}
  loading=(async()=>{
    const since=new Date(Date.now()-14*864e5).toISOString();
    const Q={
      flags:sb.from("tharavad_flags").select("key,value"),
      companies:sb.from("companies").select("*"),
      projects:sb.from("projects").select("id,name,parent_id,archived_at"),
      econ:sb.from("unit_economics").select("project_id,name,kind,month,revenue_inr,cost_inr,contribution_inr,budget_cap_monthly,cap_currency").order("month",{ascending:true}),
      health:sb.from("agent_health").select("*"),
      agents:sb.from("agents").select("id,name,note,spec,handoff,trigger_id,version"),
      runs:sb.from("runs").select("id,agent_id,started_at,ended_at,status,summary,outputs,cost_usd,error").gte("started_at",since).order("started_at",{ascending:false}).limit(400),
      asks:sb.from("asks").select("*").eq("status","open").order("deadline",{ascending:true}),
      alarms:sb.from("alarms").select("*").is("acked_at",null).order("created_at",{ascending:false}),
      proposals:sb.from("proposals").select("*").in("status",["new","parked"]).order("created_at",{ascending:false}).limit(60),
      orders:sb.from("orders").select("*").order("created_at",{ascending:false}).limit(60),
      experiments:sb.from("experiments").select("*").order("starts_on",{ascending:false}).limit(80),
      decisions:sb.from("agent_decisions").select("*").order("created_at",{ascending:false}).limit(80),
      report:sb.from("notes").select("title,body,created_at").contains("tags",["weekly-report"]).order("created_at",{ascending:false}).limit(1),
      audits:sb.from("notes").select("title,body,created_at").contains("tags",["audit"]).order("created_at",{ascending:false}).limit(3),
      cards:sb.from("library_cards").select("*"),
      assets:sb.from("commons_assets").select("*")};
    const keys=Object.keys(Q),res=await Promise.all(keys.map(k=>Promise.resolve(Q[k]).catch(e=>({error:e}))));
    const errs=[];
    keys.forEach((k,i)=>{const r=res[i]||{};if(r.error){errs.push(k);return}const d=r.data||[];
      if(k==="flags")D.flags=Object.fromEntries(d.map(x=>[x.key,x.value]));else if(k==="report")D.report=d[0]||null;else D[k]=d});
    D.errors=errs;if(errs.length<keys.length){D.ready=true;D.at=new Date()}else if(!D.ready)D.fatal=true;
    render(true)})();
  try{await loading}finally{loading=null;if(again){again=false;load()}}
}

/* ---------- Agents and runs ---------- */
const FILT=[["all","All"],["attention","Needs a look"],["green","Healthy"],["unknown","Unknown"],["off","Not built or paused"]];

const RANK={red:0,amber:1,unknown:2,green:3,planned:4,paused:5,retired:6};
function agents(){
  const list=D.health.filter(fmatch).sort((a,b)=>(RANK[hs(a)]??9)-(RANK[hs(b)]??9)||String(a.name).localeCompare(b.name));
  const lv=a=>LEVELS.some(l=>l[0]===a.level)?a.level:"shared";
  const count=k=>D.health.filter(a=>{const s=UI.agentFilter;UI.agentFilter=k;const r=fmatch(a);UI.agentFilter=s;return r}).length;

  <div class="filters" role="group" aria-label="Filter by health">${FILT.map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${UI.agentFilter===k}">${esc(l)} <span class="mono">${count(k)}</span></button>`).join("")}</div>
  ${groups.length?groups.map(([l,g])=>`<div class="lvl"><span class="eyebrow">${esc(l)} · ${g.length}</span>${g.map(agentRow).join("")}</div>`).join(""):`<p class="empty">No agents match this filter.</p>`}</section>
  ${timeline()}
  <section><div class="shead"><h2>Recent runs</h2><p class="sub">Newest first, last 14 days.</p></div>${D.runs.length?`<div class="runs">${D.runs.slice(0,30).map(r=>`<div class="run"><span class="when">${esc(ist(r.started_at))}</span><span class="what"><b>${esc(aname(r.agent_id))}</b> ${esc(r.summary||r.error||"")}${r.cost_usd?` <span class="mono">$${esc(Number(r.cost_usd).toFixed(2))}</span>`:""}</span>${pill("s-"+r.status,r.status)}</div>`).join("")}</div>`:`<p class="empty">No run has reported in the last 14 days. Runs appear here as soon as an agent files its report.</p>`}</section>`;
}
function agentRow(a){const d=D.agents.find(x=>x.id===a.id)||{},runs=D.runs.filter(r=>r.agent_id===a.id).slice(0,5),k="ag-"+a.id;
  return `<details class="agent" data-k="${esc(k)}" ${UI.open.has(k)?"open":""}><summary>${dot(a)}<span style="min-width:0"><span class="nm">${esc(a.name)}</span><span class="meta"><span>${esc(pname(a.project_id))}</span><span>${esc(a.cadence||"no schedule")}</span><span>evidence ${esc(ago(a.last_evidence))}</span><span>${plur(+a.runs_7d||0,"run")} in 7 days${a.fails_in_row?` · ${a.fails_in_row} failed in a row`:""}</span></span></span>${hpill(a)}</summary>
    <div class="body">${d.note?`<p class="why">${esc(d.note)}</p>`:""}${a.last_summary?`<p class="kvline"><b>Last report:</b> ${esc(a.last_summary)}</p>`:""}
    <p class="kvline">${[a.seats?`<b>Seats</b> ${esc(a.seats)}`:"",a.every_hours?`<b>Every</b> ${esc(a.every_hours)} h`:"",a.cost_7d!=null?`<b>Cost 7d</b> $${esc(Number(a.cost_7d).toFixed(2))}`:"",d.version?`<b>Version</b> ${esc(d.version)}`:"",a.last_ok?`<b>Last OK</b> ${esc(ist(a.last_ok))}`:""].filter(Boolean).join(" · ")||"No run details yet."}</p>
    ${runs.length?`<div class="runs">${runs.map(r=>`<div class="run"><span class="when">${esc(ist(r.started_at))}</span><span class="what">${esc(r.summary||r.error||"")}</span>${pill("s-"+r.status,r.status)}</div>`).join("")}</div>`:""}
    ${d.handoff?`<div><span class="eyebrow">Handoff</span><pre class="handoff">${esc(d.handoff)}</pre></div>`:`<p class="kvline">No handoff written yet.</p>`}</div></details>`}
function timeline(){
  const days=[...Array(14)].map((_,i)=>dayKey(Date.now()-(13-i)*864e5)),W={failed:0,blocked:1,running:2,skipped:3,succeeded:4};
  const ids=[...new Set([...D.runs.map(r=>r.agent_id),...D.health.filter(a=>a.status==="active").map(a=>a.id)])];

  const stop=flag("stop_all"),away=flag("away"),cf=k=>UI.pending?.kind==="flag"&&UI.pending.id===k;
  return `<section><div class="shead"><h2>Controls</h2><p class="sub">Database switches every run checks first, so they work even if Claude or an agent misbehaves.</p></div>
  <div class="estop${stop?" on":""}"><span class="eyebrow" style="color:inherit">Emergency stop</span><h3>${stop?"Everything is stopped":"Stop everything"}</h3>
    <p class="sub">${stop?"No run starts and no upload, send or payment step goes out. Resume when you're sure things are right.":"Halts every agent: no run starts and no upload, send or payment step goes out. Use it the moment anything looks wrong."}</p>
    ${cf("stop_all")?`<div class="confirm ${stop?"":"bad"}"><p>${stop?"Resume all agents? Each picks up at its next scheduled run.":"Stop every agent now? Work in flight halts at its next check."}</p><div class="acts"><button class="btn ${stop?"primary":"danger solid"}" data-flagyes="stop_all">${stop?"Resume everything":"Stop everything now"}</button><button class="btn" data-cancel>Cancel</button></div></div>`
      :`<div class="acts"><button class="btn big ${stop?"":"danger solid"}" data-flag="stop_all">${stop?"Resume everything":"Stop everything"}</button></div>`}</div>
  <div class="card"><div class="row"><div class="t"><span class="switch${away?" on":""}"><i aria-hidden="true"></i>Away mode is ${away?"on":"off"}</span><p class="sub" style="margin-top:6px">While you travel: veto windows pause and class C calls wait for you; routine work carries on.</p></div>
    ${cf("away")?"":`<button class="btn" data-flag="away" aria-pressed="${away}">${away?"Turn off":"Turn on"}</button>`}</div>
    ${cf("away")?`<div class="confirm"><p>Turn away mode ${away?"off? Veto windows start counting again.":"on? Veto windows pause until you're back."}</p><div class="acts"><button class="btn primary" data-flagyes="away">Turn ${away?"off":"on"}</button><button class="btn" data-cancel>Cancel</button></div></div>`:""}</div></section>`;
}

/* ---------- actions ---------- */
let tt=null;function toast(t,bad){const el=$("toast");el.textContent=t;el.className=bad?"bad":"";el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,4000)}
async function act(fn,ok){try{const{error}=await fn();if(error)throw error;UI.pending=null;if(ok)toast(ok);await load()}catch(e){UI.pending=null;render();toast("That didn't save. Check your connection and try again.",true)}}
const now=()=>new Date().toISOString();
function confirmAsk(kind,id){UI.pending={kind,id};render();const b=V.querySelector(".confirm button");if(b)b.focus()}
function onClick(e){const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if("retry" in d)return load();
  if(d.ack)return act(()=>sb.from("alarms").update({acked_at:now()}).eq("id",idv(d.ack)),"Alarm marked seen");
  if(d.done)return act(()=>sb.from("asks").update({status:"done",done_at:now()}).eq("id",idv(d.done)),"Done. Ambalam's task closes too.");
  if(d.drop)return confirmAsk("drop",idv(d.drop));
  if(d.dropyes)return act(()=>sb.from("asks").update({status:"dropped",done_at:now()}).eq("id",idv(d.dropyes)),"Dropped. The agent takes its fallback.");
  if(d.prop){const v=d.prop;return act(()=>sb.from("proposals").update({status:v,decided_at:now()}).eq("id",idv(d.pid)),v==="yes"?"Approved":v==="no"?"Rejected":"Parked")}
  if(d.veto)return confirmAsk("veto",idv(d.veto));
  if(d.vetoyes)return act(()=>sb.from("agent_decisions").update({vetoed:true}).eq("id",idv(d.vetoyes)),"Vetoed. The agent reverses it.");
  if(d.pause)return confirmAsk("pause",d.pause);
  if(d.pauseyes){const c=co(d.pauseyes),p=!!c?.paused_at;return act(()=>sb.from("companies").update({paused_at:p?null:now()}).eq("project_id",d.pauseyes),p?"Resumed":"Paused")}
  if(d.flag)return confirmAsk("flag",d.flag);
  if(d.flagyes){const k=d.flagyes,v=!flag(k);return act(()=>sb.from("tharavad_flags").update({value:v,updated_at:now()}).eq("key",k),k==="stop_all"?(v?"Everything is stopped":"Agents resumed"):(v?"Away mode on":"Away mode off"))}
  if(d.filter){UI.agentFilter=d.filter;focusNext=`[data-filter="${d.filter}"]`;return render()}
  if(d.prio){UI.prio=d.prio;focusNext=`[data-prio="${d.prio}"]`;render();if($("tellDlg").open){paintDlg();$("tellDlgBody").querySelector(`[data-prio="${d.prio}"]`)?.focus()}return}
  if(d.kind){UI.kind=d.kind;focusNext=`[data-kind="${d.kind}"]`;render();if($("tellDlg").open){paintDlg();$("tellDlgBody").querySelector(`[data-kind="${d.kind}"]`)?.focus()}return}
  if(d.ofilter){UI.ordFilter=d.ofilter;focusNext=`[data-ofilter="${d.ofilter}"]`;return render()}
  if("cancel" in d){UI.pending=null;render()}}
function onInput(e){const t=e.target;if(t.matches("[data-draft]"))UI.draft=t.value;if(t.matches("[data-unitsel]"))UI.unit=t.value;if(t.matches("[data-link]"))UI.link=t.value;if(t.id==="libQ"){UI.libQ=t.value;filterLib()}}
const fixLink=v=>{v=String(v||"").trim();if(!v)return "";return /^https?:\/\//i.test(v)?v:/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(v)?"https://"+v:v};
async function onSubmit(e){const f=e.target.closest("[data-tell]");if(!f)return;e.preventDefault();if(UI.sending)return;
  const idea=UI.kind==="idea",link=idea?fixLink(UI.link):"",request=UI.draft.trim()||link;if(!request){if(idea)toast("Add a link or a few words first.",true);return}
  UI.sending=true;render();
  const row=idea?{from_who:"vimal",kind:"idea",link:link||null,request,project_id:UI.unit||null,priority:"low"}:{from_who:"vimal",kind:"order",project_id:UI.unit||null,request,priority:UI.prio};
  try{const{error}=await sb.from("orders").insert(row);if(error)throw error;
    UI.draft="";UI.unit="";UI.prio="med";UI.kind="order";UI.link="";UI.sending=false;if($("tellDlg").open)$("tellDlg").close();
    toast(idea?"Idea saved. A scout looks at it and writes a verdict under Ideas.":"Sent. It shows in Orders as New until an agent picks it up.");await load()}
  catch(err){UI.sending=false;render();toast(idea?"That idea didn't send. Your words are kept; try again.":"That order didn't send. Your words are kept; try again.",true)}}
for(const el of [V,$("tellDlgBody")]){el.addEventListener("click",onClick);el.addEventListener("input",onInput);el.addEventListener("change",onInput);el.addEventListener("submit",onSubmit)}
V.addEventListener("toggle",e=>{const k=e.target.dataset?.k;if(k)e.target.open?UI.open.add(k):UI.open.delete(k)},true);
function openTell(){paintDlg();if(!$("tellDlg").open)$("tellDlg").showModal();$("dlgText").focus()}
$("tellOpen").addEventListener("click",openTell);
$("tellClose").addEventListener("click",()=>$("tellDlg").close());
$("tellDlg").addEventListener("close",()=>{if(route().v==="orders")render()});
addEventListener("hashchange",()=>{UI.pending=null;render();scrollTo(0,0)});

/* ---------- boot: same sign-in as Ambalam ---------- */
function showLogin(msg){V.innerHTML=`<form class="login" id="loginForm"><h2>Tharavad</h2><p class="sub">${esc(msg||"Sign in with your email. We'll send you a link.")}</p><label class="sr" for="loginEmail">Email</label><input id="loginEmail" type="email" name="email" required placeholder="you@example.com" autocomplete="email"><button class="btn primary" type="submit">Send sign-in link</button></form>`;
  $("loginForm").addEventListener("submit",async e=>{e.preventDefault();const{error}=await sb.auth.signInWithOtp({email:e.target.email.value.trim(),options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});
    showLogin(error?"That email can't sign in here. Check the address and try again.":"Check your inbox and tap the link.")})}
/* ---------- share target: a link shared from the phone lands as an idea ---------- */
const SHARE_KEY="tharavad.share.v1";
function parseShare(q){const url=(q.get("url")||"").trim(),text=(q.get("text")||"").trim(),title=(q.get("title")||"").trim();
  if(!url&&!text&&!title)return null;
  const found=(text.match(/https?:\/\/[^\s<>"']+/i)||title.match(/https?:\/\/[^\s<>"']+/i)||[""])[0].replace(/[).,;:!?]+$/,"");
  const link=safeUrl(url)?url:found||url,strip=s=>(link?s.split(link).join(" "):s).replace(/[ \t]+/g," ").trim();
  const parts=[strip(title),strip(text)].filter(Boolean);
  return {link,request:[...new Set(parts)].join("\n")}}
(()=>{try{const q=new URLSearchParams(location.search),sh=parseShare(q);if(!sh)return;
  try{sessionStorage.setItem(SHARE_KEY,JSON.stringify(sh))}catch(e){window.__share=sh}
  for(const k of ["url","text","title"])q.delete(k);const qs=q.toString();history.replaceState(null,"",location.pathname+(qs?"?"+qs:"")+location.hash)}catch(e){}})();
function takeShare(){let sh=window.__share||null;window.__share=null;try{const v=sessionStorage.getItem(SHARE_KEY);if(v){sh=JSON.parse(v);sessionStorage.removeItem(SHARE_KEY)}}catch(e){}
  if(!sh)return;UI.kind="idea";UI.link=String(sh.link||"");UI.draft=String(sh.request||"");openTell()}
let started=false;
async function start(){if(started)return;started=true;$("tellOpen").hidden=false;render();await load();takeShare();
  let ch=sb.channel("tharavad");for(const t of ["asks","alarms","runs","tharavad_flags","proposals","orders","agent_decisions","companies","experiments"])ch=ch.on("postgres_changes",{event:"*",schema:"public",table:t},soon);ch.subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
  setInterval(()=>{if(!document.hidden)render(true)},6e4);
  document.addEventListener("focusout",()=>setTimeout(()=>{if(deferred&&!typing()){deferred=false;render()}},0))}
window.TH={start,load,D,UI,parseShare};
(async()=>{const{data:{session}}=await sb.auth.getSession();if(session)start();else showLogin();sb.auth.onAuthStateChange((ev,s)=>{if(s&&!started)start()})})();
</script>
